answer":"**L1 regularization (Lasso)** adds the sum of the absolute values of the model weights to the loss function:\n\\[L_{total}=L_{original}+\\lambda\\sum_i|w_i|\\]\n\n**L2 regularization (Ridge)** adds the sum of the squared weights:\n\\[L_{total}=L_{original}+\\lambda\\sum_i w_i^2\\]\n\nL1 can drive some weights to zero, while L2 generally shrinks weights toward zero.","topic":"L1 and L2 Regularization","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT01_IMP_A09","questionNumber":9,"question":"Differentiate between machine learning and deep learning.","answer":"| Machine Learning | Deep Learning |\n|---|---|\n| Uses algorithms to learn patterns from data. | Uses multi-layered neural networks to learn patterns. |\n| Often requires manual feature extraction. | Can automatically learn features from raw data. |\n| Can work well with smaller datasets, depending on the task. | Often requires large datasets and high computational power. |\n| Includes decision trees and support vector machines. | Includes CNNs, RNNs and deep neural networks. |","topic":"Machine Learning vs Deep Learning","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT01_IMP_A10","questionNumber":10,"question":"What are the applications of deep learning?","answer":"Important applications of **deep learning** include:\n\n- **Computer vision:** Image classification and object detection.\n- **Natural language processing:** Translation and text generation.\n- **Speech processing:** Speech recognition and voice assistants.\n- **Healthcare:** Medical image analysis.\n- **Autonomous systems:** Self-driving vehicles and robotics.","topic":"Applications of Deep Learning","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT01_IMP_A11","questionNumber":11,"question":"State the advantages and disadvantages of deep learning.","answer":"**Advantages:**\n- Automatically learns complex features from data.\n- Handles large and complex datasets.\n- Provides high accuracy in many image, speech and language tasks.\n\n**Disadvantages:**\n- Often requires large amounts of labelled data.\n- Needs high computational power and training time.\n- Can be difficult to interpret and explain.","topic":"Advantages and Disadvantages of Deep Learning","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT01_IMP_A12","questionNumber":12,"question":"State Bayes' rule with its formula.","answer":"**Bayes' rule** calculates the probability of an event or hypothesis using prior knowledge and new evidence.\n\n\\[P(A|B)=\\frac{P(B|A)P(A)}{P(B)}\\]\n\nHere, \\(P(A|B)\\) is the posterior probability, \\(P(B|A)\\) is the likelihood, \\(P(A)\\) is the prior probability, and \\(P(B)\\) is the evidence probability, provided \\(P(B)>0\\).","topic":"Bayes' Rule","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT01_IMP_A13","questionNumber":13,"question":"What are the types of gradient descent?","answer":"The three common types of gradient descent are:\n\n1. **Batch Gradient Descent:** Updates parameters using the entire training dataset.\n2. **Stochastic Gradient Descent:** Updates parameters using one training example at a time.\n3. **Mini-batch Gradient Descent:** Updates parameters using a small batch of training examples.","topic":"Types of Gradient Descent","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT01_IMP_A14","questionNumber":14,"question":"What is meant by gradient descent?","answer":"**Gradient Descent** is an iterative optimization algorithm used to minimize a loss or cost function. It updates model parameters in the direction opposite to the gradient, because that direction reduces the function locally.\n\nThe update rule is:\n\\[\\theta_{new}=\\theta_{old}-\\eta\\nabla J(\\theta)\\]\n\nHere, \\(\\eta\\) is the learning rate and \\(J(\\theta)\\) is the loss function.","topic":"Gradient Descent","difficulty":"Easy","verificationStatus":"needs_review"}],"metadata":{"totalQuestions":14,"unitStatus":"completed","source":"User-provided selected questions"}}</script>
<script type="application/json" data-important-unit="AD3501_UNIT02_Important_2_Marks.json">{"schemaVersion":"1.0","feature":"important_2_marks","subject":{"subjectCode":"AD3501","subjectName":"Deep Learning","regulation":"R2021","semester":5},"unit":{"unitId":"UNIT02","unitNumber":2,"unitTitle":"Convolutional Neural Network"},"importantTwoMarks":[{"questionId":"UNIT02_IMP_A01","questionNumber":1,"question":"What is sparse interaction in a Convolutional Neural Network?","answer":"**Sparse interaction** means that a neuron in a convolutional layer is connected only to a small local region of the input, called its **receptive field**, rather than to every input value. This reduces the number of connections and parameters, making computation more efficient.","topic":"Sparse Interactions","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A02","questionNumber":2,"question":"Present an outline of the pooling layer in a Convolutional Neural Network.","answer":"A **pooling layer** reduces the spatial dimensions of feature maps by summarizing values within small regions.\n\n- **Max pooling:** Selects the maximum value from each region.\n- **Average pooling:** Calculates the average value from each region.\n\nIt reduces computation and provides some tolerance to small shifts in features.","topic":"Pooling Layer","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A03","questionNumber":3,"question":"Define pooling in the context of Convolutional Neural Networks.","answer":"**Pooling** is a down-sampling operation used in CNNs to reduce the height and width of feature maps. It summarizes nearby values using operations such as maximum or average, helping reduce computation and the sensitivity of features to small spatial changes.","topic":"Pooling","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A04","questionNumber":4,"question":"List the importance of equivariance in a Convolutional Neural Network.","answer":"**Equivariance** means that when the input is transformed, the feature map changes correspondingly. In CNNs, translation equivariance is important because:\n\n- A shifted object produces a similarly shifted feature map.\n- Spatial information about feature locations is preserved.\n- The same filters can detect features at different image locations.","topic":"Equivariance","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A05","questionNumber":5,"question":"Define a loss function for image identification.","answer":"For image identification (image classification), a **loss function** measures the difference between the predicted class probabilities and the actual class label. **Categorical cross-entropy** is commonly used for multi-class classification; it penalizes the model when it assigns a low probability to the correct class.","topic":"Loss Function for Image Classification","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A06","questionNumber":6,"question":"State the purpose of an activation function in a Convolutional Neural Network.","answer":"An **activation function** introduces non-linearity into a CNN. It enables the network to learn complex patterns that cannot be represented by linear operations alone. **ReLU (Rectified Linear Unit)** is commonly used in hidden layers and is defined as \\(f(x)=\\max(0,x)\\).","topic":"Activation Functions","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A07","questionNumber":7,"question":"What is a Convolutional Neural Network?","answer":"A **Convolutional Neural Network (CNN)** is a type of deep neural network designed mainly to process grid-like data such as images. It uses convolutional filters to automatically learn spatial features such as edges, textures and shapes. CNNs are widely used in image classification and object detection.","topic":"Introduction to CNN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A08","questionNumber":8,"question":"Explain the architecture of a Convolutional Neural Network.","answer":"A typical **CNN architecture** consists of the following layers:\n\n1. **Input layer:** Receives the image.\n2. **Convolutional layer:** Extracts features using filters.\n3. **Activation layer:** Adds non-linearity, commonly using ReLU.\n4. **Pooling layer:** Reduces feature-map dimensions.\n5. **Fully connected layer:** Combines learned features.\n6. **Output layer:** Produces the final class prediction.","topic":"CNN Architecture","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A09","questionNumber":9,"question":"What is meant by pooling?","answer":"**Pooling** is a down-sampling technique in CNNs that summarizes values in a local region of a feature map. Max pooling selects the largest value, while average pooling calculates the mean. It reduces feature-map size and computational cost.","topic":"Pooling","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A10","questionNumber":10,"question":"List some types of loss functions.","answer":"Common loss functions used in deep learning include:\n\n- **Mean Squared Error (MSE):** Commonly used for regression.\n- **Mean Absolute Error (MAE):** Measures the average absolute prediction error.\n- **Binary Cross-Entropy:** Used for binary classification.\n- **Categorical Cross-Entropy:** Used for multi-class classification.\n- **Hinge Loss:** Used in margin-based classification methods.","topic":"Types of Loss Functions","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A11","questionNumber":11,"question":"What is a loss function in a Convolutional Neural Network?","answer":"A **loss function** measures how different a CNN's predicted output is from the actual target. It provides an error value that is used during backpropagation and optimization to update the network's weights and improve its predictions.","topic":"Loss Function","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A12","questionNumber":12,"question":"What is tiled convolution?","answer":"**Tiled convolution** is a convolutional operation in which filters are applied across image regions using a structured tiling pattern. In CNN descriptions, tiled convolution can also refer to using multiple learned filters per spatial location with partial weight sharing, providing more flexibility than standard convolution while retaining local connectivity.","topic":"Tiled Convolution","difficulty":"Hard","verificationStatus":"needs_review"},{"questionId":"UNIT02_IMP_A13","questionNumber":13,"question":"What are the parameters that define a convolutional layer?","answer":"The main parameters that define a convolutional layer are:\n\n- **Number of filters:** Determines the number of output feature maps.\n- **Kernel size:** Specifies the filter dimensions.\n- **Stride:** Determines the step size of filter movement.\n- **Padding:** Controls how borders are handled.\n- **Dilation:** Specifies spacing between kernel elements.","topic":"Convolutional Layer Parameters","difficulty":"Medium","verificationStatus":"needs_review"}],"metadata":{"totalQuestions":13,"unitStatus":"completed","source":"User-provided selected questions"}}</script>
<script type="application/json" data-important-unit="AD3501_UNIT03_Important_2_Marks.json">{"schemaVersion":"1.0","feature":"important_2_marks","subject":{"subjectCode":"AD3501","subjectName":"Deep Learning","regulation":"R2021","semester":5},"unit":{"unitId":"UNIT03","unitNumber":3,"unitTitle":"Recurrent Neural Networks"},"importantTwoMarks":[{"questionId":"UNIT03_IMP_A01","questionNumber":1,"question":"What is a Recurrent Neural Network (RNN)?","answer":"A **Recurrent Neural Network (RNN)** is a type of neural network designed to process sequential data. It maintains a hidden state that carries information from previous time steps, allowing the network to use past information when processing the current input.","topic":"Introduction to RNN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A02","questionNumber":2,"question":"What are the types of Recurrent Neural Networks?","answer":"Common RNN architectures based on input-output sequence structure are:\n\n- **One-to-One:** One input produces one output.\n- **One-to-Many:** One input produces a sequence of outputs.\n- **Many-to-One:** A sequence of inputs produces one output.\n- **Many-to-Many:** A sequence of inputs produces a sequence of outputs.","topic":"Types of RNN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A03","questionNumber":3,"question":"State the advantages and disadvantages of Recurrent Neural Networks.","answer":"**Advantages:**\n- Can process sequential and time-dependent data.\n- Shares parameters across time steps.\n- Uses previous information through its hidden state.\n\n**Disadvantages:**\n- Can suffer from vanishing and exploding gradients.\n- Training may be slow because sequence steps are processed in order.\n- Basic RNNs may struggle to learn long-term dependencies.","topic":"Advantages and Disadvantages of RNN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A04","questionNumber":4,"question":"What are the applications of Recurrent Neural Networks?","answer":"RNNs are used in applications involving sequential data, such as:\n\n- Speech recognition.\n- Language modelling and text generation.\n- Machine translation.\n- Sentiment analysis.\n- Time-series forecasting.","topic":"Applications of RNN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A05","questionNumber":5,"question":"Define gradient descent.","answer":"**Gradient Descent** is an iterative optimization algorithm used to minimize a model's loss function. It updates model parameters in the direction opposite to the gradient of the loss, using a learning rate to control the update size.","topic":"Gradient Descent","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A06","questionNumber":6,"question":"What is the chain rule?","answer":"The **chain rule** is a differentiation rule used to find the derivative of a composite function. If \\(y=f(g(x))\\), then:\n\n\\[\\frac{dy}{dx}=\\frac{dy}{dg}\\times\\frac{dg}{dx}\\]\n\nIn neural networks, it is used during backpropagation to calculate gradients through multiple connected layers or time steps.","topic":"Chain Rule","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A07","questionNumber":7,"question":"What is a Bidirectional Recurrent Neural Network (BiRNN)?","answer":"A **Bidirectional Recurrent Neural Network (BiRNN)** processes a sequence in two directions: forward, from past to future, and backward, from future to past. It combines information from both directions to use context from the entire sequence.","topic":"Bidirectional RNN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A08","questionNumber":8,"question":"Differentiate between RNN and CNN.","answer":"| RNN | CNN |\n|---|---|\n| Designed mainly for sequential data. | Designed mainly for grid-like data such as images. |\n| Uses recurrent connections and hidden states. | Uses convolutional filters to extract local features. |\n| Processes information across time steps. | Processes spatial patterns such as edges and shapes. |\n| Used in language and time-series tasks. | Used in image classification and object detection. |","topic":"RNN vs CNN","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A09","questionNumber":9,"question":"What is Long Short-Term Memory (LSTM)?","answer":"**Long Short-Term Memory (LSTM)** is a special type of RNN designed to learn long-term dependencies in sequential data. It uses a memory cell and three main gates—input, forget and output gates—to control the flow of information and reduce the vanishing-gradient problem.","topic":"Long Short-Term Memory","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A10","questionNumber":10,"question":"How does LSTM differ from a traditional RNN?","answer":"| Traditional RNN | LSTM |\n|---|---|\n| Has a comparatively simple recurrent hidden state. | Uses a memory cell and gating mechanisms. |\n| Often struggles to retain information over long sequences. | Can preserve useful information over longer sequences. |\n| More affected by vanishing gradients. | Gates help reduce the vanishing-gradient problem. |","topic":"LSTM vs RNN","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A11","questionNumber":11,"question":"Define the encoder design pattern in RNNs.","answer":"In the **encoder design pattern**, an RNN reads an input sequence one element at a time and converts it into a learned representation, often a final hidden state or context vector. This representation summarizes the input and can be passed to another network, such as a decoder, for a later task.","topic":"RNN Encoder Design Pattern","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A12","questionNumber":12,"question":"State the merits of using unfolding graphs to understand the behaviour of Recurrent Neural Networks.","answer":"An **unfolding graph** represents an RNN across successive time steps as a sequence of connected copies of the same recurrent computation. Its merits are:\n\n- Makes the flow of information across time easier to understand.\n- Shows how hidden states depend on previous time steps.\n- Helps explain backpropagation through time (BPTT).","topic":"Unfolding Graphs","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A13","questionNumber":13,"question":"How does a Bidirectional RNN differ from a traditional RNN?","answer":"A **traditional RNN** processes a sequence in one direction, usually from past to future. A **Bidirectional RNN** uses two recurrent layers to process the sequence in both forward and backward directions, combining both outputs so each position can use past and future context.","topic":"Bidirectional RNN vs RNN","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT03_IMP_A14","questionNumber":14,"question":"List some real-time applications of the encoder model.","answer":"RNN encoder models are used to convert input sequences into compact representations for tasks such as:\n\n- Machine translation systems.\n- Text summarization.\n- Speech recognition.\n- Question-answering systems.\n- Sentiment analysis and sequence classification.","topic":"Applications of RNN Encoder Models","difficulty":"Easy","verificationStatus":"needs_review"}],"metadata":{"totalQuestions":14,"unitStatus":"completed","source":"User-provided selected questions"}}</script>
<script type="application/json" data-important-unit="AD3501_UNIT04_Important_2_Marks.json">{"schemaVersion":"1.0","feature":"important_2_marks","subject":{"subjectCode":"AD3501","subjectName":"Deep Learning","regulation":"R2021","semester":5},"unit":{"unitId":"UNIT04","unitNumber":4,"unitTitle":"Model Evaluation"},"importantTwoMarks":[{"questionId":"UNIT04_IMP_A01","questionNumber":1,"question":"Differentiate between Grid Search and Random Search.","answer":"| Grid Search | Random Search |\n|---|---|\n| Tests every combination in a predefined set of hyperparameter values. | Tests randomly selected combinations from specified ranges or distributions. |\n| The number of trials grows with the number of values and hyperparameters. | The number of trials is controlled by a chosen trial budget. |\n| Can be expensive when many hyperparameters are considered. | Often explores a large search space more efficiently. |","topic":"Grid Search vs Random Search","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A02","questionNumber":2,"question":"State the activation function hyperparameter in a neural network.","answer":"The **activation function** is a hyperparameter choice that determines the non-linear function applied to a neuron's weighted input. Common choices include **ReLU**, **sigmoid**, **tanh** and **softmax**. The choice affects how the network learns and produces outputs.","topic":"Activation Function Hyperparameter","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A03","questionNumber":3,"question":"Define the regularized ReLU activation function.","answer":"**ReLU (Rectified Linear Unit)** is an activation function defined as \\(f(x)=\\max(0,x)\\). It outputs zero for negative inputs and the input itself for positive inputs. Regularization is generally applied separately as a penalty on model weights or activations to help reduce overfitting; it is not a single universally defined ReLU variant.","topic":"ReLU Activation and Regularization","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A04","questionNumber":4,"question":"Define MSE and MAE metrics used in model evaluation.","answer":"**Mean Squared Error (MSE)** is the average of the squared differences between actual and predicted values. **Mean Absolute Error (MAE)** is the average of the absolute differences.\n\n\\[MSE=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2\\]\n\\[MAE=\\frac{1}{n}\\sum_{i=1}^{n}|y_i-\\hat y_i|\\]\n\nHere, \\(y_i\\) is the actual value and \\(\\hat y_i\\) is the predicted value.","topic":"MSE and MAE","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A05","questionNumber":5,"question":"What is Independent Component Analysis (ICA)?","answer":"**Independent Component Analysis (ICA)** is a statistical technique used to separate a multivariate signal into underlying components that are as statistically independent as possible. It is commonly used in blind source separation, such as separating different audio sources recorded together.","topic":"Independent Component Analysis","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A06","questionNumber":6,"question":"List the tasks that can be performed by probabilistic models.","answer":"Probabilistic models represent uncertainty using probability distributions. They can be used for:\n\n- **Classification and prediction**.\n- **Density estimation** and modelling data distributions.\n- **Clustering** and discovering hidden groups.\n- **Sequence modelling**, such as speech or language processing.\n- **Inference** and reasoning under uncertainty.","topic":"Tasks of Probabilistic Models","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A07","questionNumber":7,"question":"What is model evaluation?","answer":"**Model evaluation** is the process of measuring how well a trained machine learning model performs on data. It uses suitable metrics, such as accuracy, precision, recall, F-score or mean squared error, to assess predictive performance and generalization to unseen data.","topic":"Model Evaluation","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A08","questionNumber":8,"question":"What is a confusion matrix?","answer":"A **confusion matrix** is a table used to evaluate a classification model by comparing actual and predicted class labels. For binary classification, it records four outcomes: **True Positive (TP)**, **True Negative (TN)**, **False Positive (FP)** and **False Negative (FN)**.","topic":"Confusion Matrix","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A09","questionNumber":9,"question":"What is F-score?","answer":"**F-score** combines precision and recall into a single measure. The commonly used **F1-score** is their harmonic mean:\n\n\\[F1=2\\times\\frac{Precision\\times Recall}{Precision+Recall}\\]\n\nIt is useful when both false positives and false negatives matter, especially with imbalanced classes.","topic":"F-Score","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A10","questionNumber":10,"question":"What is a baseline model?","answer":"A **baseline model** is a simple reference model used as a starting point for evaluating more advanced models. It provides a minimum or benchmark performance level, helping determine whether a complex model offers a meaningful improvement.","topic":"Baseline Model","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A11","questionNumber":11,"question":"Define hyperparameter.","answer":"A **hyperparameter** is a configuration value set before or during model training that controls the learning process or model structure. Examples include learning rate, batch size, number of epochs, number of hidden layers and the number of neurons.","topic":"Hyperparameters","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A12","questionNumber":12,"question":"What are the types of baseline models?","answer":"Common baseline approaches include:\n\n- **Majority-class baseline:** Predicts the most frequent class.\n- **Random baseline:** Makes predictions randomly, often using class frequencies.\n- **Simple rule-based baseline:** Uses a basic predefined rule.\n- **Simple statistical baseline:** Uses measures such as the mean or median for regression.\n\nThe appropriate baseline depends on the task.","topic":"Types of Baseline Models","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A13","questionNumber":13,"question":"What are Grid Search and Random Search?","answer":"**Grid Search** is a hyperparameter tuning method that evaluates every combination from a predefined set of values. **Random Search** evaluates a fixed number of randomly selected combinations from specified ranges or distributions. Both methods help identify hyperparameters that improve model performance.","topic":"Hyperparameter Search Methods","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT04_IMP_A14","questionNumber":14,"question":"Define accuracy, precision and recall with their formulas.","answer":"- **Accuracy:** Proportion of all predictions that are correct. \\(Accuracy=\\frac{TP+TN}{TP+TN+FP+FN}\\)\n- **Precision:** Proportion of predicted positive cases that are actually positive. \\(Precision=\\frac{TP}{TP+FP}\\)\n- **Recall:** Proportion of actual positive cases correctly identified. \\(Recall=\\frac{TP}{TP+FN}\\)\n\nHere, TP = True Positive, TN = True Negative, FP = False Positive and FN = False Negative.","topic":"Classification Evaluation Metrics","difficulty":"Medium","verificationStatus":"needs_review"}],"metadata":{"totalQuestions":14,"unitStatus":"completed","source":"User-provided selected questions"}}</script>
<script type="application/json" data-important-unit="AD3501_UNIT05_Important_2_Marks.json">{"schemaVersion":"1.0","feature":"important_2_marks","subject":{"subjectCode":"AD3501","subjectName":"Deep Learning","regulation":"R2021","semester":5},"unit":{"unitId":"UNIT05","unitNumber":5,"unitTitle":"Autoencoders and Generative Models"},"importantTwoMarks":[{"questionId":"UNIT05_IMP_A01","questionNumber":1,"question":"What is a stochastic encoder?","answer":"A **stochastic encoder** maps an input into a probability distribution in the latent space rather than producing one fixed latent representation. It then samples a latent vector from that distribution. This allows the model to represent uncertainty and generate varied outputs.","topic":"Stochastic Encoder","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A02","questionNumber":2,"question":"What are regularized autoencoders?","answer":"**Regularized autoencoders** are autoencoders trained with additional constraints or penalty terms to encourage useful latent representations and prevent the model from simply copying the input. Examples include sparse, denoising and contractive autoencoders.","topic":"Regularized Autoencoders","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A03","questionNumber":3,"question":"Explain the working of an undercomplete autoencoder.","answer":"An **undercomplete autoencoder** has a latent representation with fewer dimensions than the input. Its encoder compresses the input into this smaller representation, and its decoder reconstructs the input from it. Training minimizes reconstruction error, encouraging the model to learn the most useful features.","topic":"Undercomplete Autoencoder","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A04","questionNumber":4,"question":"What are deep generative models?","answer":"**Deep generative models** are deep-learning models that learn the underlying probability distribution of training data. They can use this learned distribution to generate new samples, such as images, text or audio, that resemble the training data.","topic":"Deep Generative Models","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A05","questionNumber":5,"question":"What is the role of the generator and discriminator in GANs?","answer":"A **Generative Adversarial Network (GAN)** contains two competing networks:\n\n- **Generator:** Creates synthetic samples from random input to imitate real data.\n- **Discriminator:** Distinguishes real training samples from generated samples.\n\nTheir adversarial training helps the generator produce increasingly realistic data.","topic":"Generator and Discriminator in GAN","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A06","questionNumber":6,"question":"Define dimensionality reduction in autoencoders.","answer":"**Dimensionality reduction** is the process of representing input data using fewer features or dimensions. In an autoencoder, the encoder maps the input into a lower-dimensional latent representation, reducing data size while retaining important information for reconstruction.","topic":"Dimensionality Reduction","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A07","questionNumber":7,"question":"What are the types of autoencoders?","answer":"Common types of autoencoders include:\n\n- **Undercomplete autoencoder**\n- **Sparse autoencoder**\n- **Denoising autoencoder**\n- **Contractive autoencoder**\n- **Variational autoencoder (VAE)**","topic":"Types of Autoencoders","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A08","questionNumber":8,"question":"What is Principal Component Analysis (PCA)?","answer":"**Principal Component Analysis (PCA)** is a statistical dimensionality-reduction technique that transforms data into a smaller set of uncorrelated variables called principal components. These components are ordered by the amount of data variance they explain.","topic":"Principal Component Analysis","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A09","questionNumber":9,"question":"What are stochastic encoders and decoders?","answer":"A **stochastic encoder** maps an input to a probability distribution and samples a latent representation from it. A **stochastic decoder** uses a latent representation to define a probability distribution over possible outputs and samples a reconstruction from that distribution.","topic":"Stochastic Encoders and Decoders","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A10","questionNumber":10,"question":"What are generative models?","answer":"**Generative models** are machine-learning models that learn the probability distribution of observed data and use it to generate new data samples. Examples include Variational Autoencoders (VAEs) and Generative Adversarial Networks (GANs).","topic":"Generative Models","difficulty":"Easy","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A11","questionNumber":11,"question":"What is a Variational Autoencoder (VAE)?","answer":"A **Variational Autoencoder (VAE)** is a probabilistic generative model that learns a distribution over latent representations. Its encoder estimates the latent distribution, and its decoder generates or reconstructs data from sampled latent vectors. Training combines reconstruction loss with a regularization term, commonly KL divergence.","topic":"Variational Autoencoder","difficulty":"Medium","verificationStatus":"needs_review"},{"questionId":"UNIT05_IMP_A12","questionNumber":12,"question":"What is a Generative Adversarial Network (GAN)?","answer":"A **Generative Adversarial Network (GAN)** is a generative model consisting of two neural networks: a generator and a discriminator. The generator creates synthetic data, while the discriminator tries to distinguish generated data from real data. They are trained adversarially to improve the quality of generated samples.","topic":"Generative Adversarial Network","difficulty":"Easy","verificationStatus":"needs_review"}],"metadata":{"totalQuestions":12,"unitStatus":"completed","source":"User-provided selected questions"}}</script>

        self.add(Object.assign({kind:'Unit',title:'Unit '+roman(u.unitNumber)+' – '+u.unitTitle,text:'',sec:null},base));
        u.sections.partA.forEach(function(q){self.add(Object.assign({kind:'Part A',title:q.id+'. '+q.question,text:plain(q.answer),sec:'a',fid:q.id},base));});
        u.sections.partBSynopsis.forEach(function(q){
          self.add(Object.assign({kind:'Part B',title:q.id+'. '+q.question,text:'',sec:'b',fid:q.id},base));
          q.subtopics.forEach(function(st){self.add(Object.assign({kind:'Subtopic',title:st.title,text:'',sec:'b',fid:st.id,ctx:ctx+' › '+q.id},{sid:base.sid,uid:base.uid}));});
        });
        u.sections.partBAnswers.forEach(function(q){q.sections.forEach(function(sec,k){
          self.add({kind:'Answer',title:q.id+' · '+sec.heading,text:plain(sec.content),sec:'c',fid:q.id+':'+k,sid:s.subjectId,uid:u.unitId,ctx:ctx});});});

  },
  query:function(q){
    var terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return [];
    var res=[];
    this.idx.forEach(function(e){
      var ok=terms.every(function(t){return e.hay.indexOf(t)>-1;});if(!ok)return;
      var tl=e.title.toLowerCase(),sc=0;terms.forEach(function(t){if(tl.indexOf(t)>-1)sc+=10;if(tl.indexOf(t)===0)sc+=5;});
      sc+={Subject:6,Unit:5,'Part A':4,'Part B':4,Subtopic:3,Answer:1}[e.kind]||0;
      res.push({e:e,score:sc});});
    res.sort(function(a,b){return b.score-a.score;});
    return res.slice(0,60).map(function(r){return r.e;});
  },
  snippet:function(e,terms){
    var txt=e.text||'';if(!txt)return '';
    var low=txt.toLowerCase(),at=-1;terms.forEach(function(t){var p=low.indexOf(t);if(p>-1&&(at<0||p<at))at=p;});
    if(at<0)at=0;var from=Math.max(0,at-50),s=txt.slice(from,from+170);
    return (from>0?'…':'')+s+(from+170<txt.length?'…':'');
  }
};
function markTerms(text,terms){

  return h;
}

/* =====================================================================
   IMPORTANT 2 MARKS — isolated JSON loader and registry
   ===================================================================== */
var ImportantMarks={
  units:[],byKey:{},errors:[],
  key:function(raw){return String(raw.subject.subjectCode).trim()+'::'+String(raw.unit.unitId).trim();},
  validate:function(raw){
    var errors=[];
    if(!isObj(raw))return ['JSON root must be an object.'];
    if(String(raw.schemaVersion||'').split('.')[0]!=='1')errors.push('Unsupported or missing schemaVersion (expected major version 1).');
    if(raw.feature!=='important_2_marks')errors.push('feature must be "important_2_marks".');
    if(!isObj(raw.subject))errors.push('subject metadata is required.');
    if(!isObj(raw.unit))errors.push('unit metadata is required.');
    if(!Array.isArray(raw.importantTwoMarks)||!raw.importantTwoMarks.length)errors.push('importantTwoMarks must be a non-empty array.');
    if(errors.length)return errors;
    if(!isStr(raw.subject.subjectCode))errors.push('subject.subjectCode is required.');
    if(!isStr(raw.subject.subjectName))errors.push('subject.subjectName is required.');
    if(!isStr(raw.unit.unitId))errors.push('unit.unitId is required.');
    if(!(Number.isInteger(raw.unit.unitNumber)&&raw.unit.unitNumber>0))errors.push('unit.unitNumber must be a positive integer.');
    if(!isStr(raw.unit.unitTitle))errors.push('unit.unitTitle is required.');
    var ids={},numbers={};
    raw.importantTwoMarks.forEach(function(q,i){
      var where='Question '+(i+1);
      if(!isObj(q)){errors.push(where+' must be an object.');return;}
      if(!isStr(q.questionId))errors.push(where+': questionId is required.');
      else if(ids[q.questionId])errors.push(where+': duplicate questionId "'+q.questionId+'".');else ids[q.questionId]=1;
      if(!(Number.isInteger(q.questionNumber)&&q.questionNumber>0))errors.push(where+': questionNumber must be a positive integer.');
      else if(numbers[q.questionNumber])errors.push(where+': duplicate questionNumber '+q.questionNumber+'.');else numbers[q.questionNumber]=1;
      if(!isStr(q.question))errors.push(where+': question text is required.');
      if(!isStr(q.answer))errors.push(where+': answer text is required.');
    });
    return errors;
  },
  register:function(raw,source){
    var problems=this.validate(raw);
    if(problems.length){this.errors.push({source:source||'JSON',messages:problems});return false;}
    var key=this.key(raw);
    if(this.byKey[key]){if(JSON.stringify(this.byKey[key])!==JSON.stringify(raw))this.errors.push({source:source||'JSON',messages:['Conflicting duplicate unit '+key+' was skipped.']});return false;}
    var copy=clone(raw);this.byKey[key]=copy;this.units.push(copy);return true;
  },
  loadInline:function(){
    var self=this;
    document.querySelectorAll('script[type="application/json"][data-important-unit]').forEach(function(node){
      try{self.register(JSON.parse(node.textContent),node.dataset.importantUnit||'embedded JSON');}
      catch(e){self.errors.push({source:node.dataset.importantUnit||'embedded JSON',messages:['Invalid JSON: '+e.message]});}
    });
  },
  loadSaved:function(){
    var saved=Store.get('importantMarks',[]),self=this;
    if(!Array.isArray(saved))return;
    saved.forEach(function(item,i){self.register(item,'Saved unit JSON '+(i+1));});
  },
  loadManifest:function(){
    var self=this;
    if(typeof fetch!=='function'||location.protocol==='file:')return Promise.resolve();
    var manifestUrl=new URL('important-2-marks/manifest.json',document.baseURI).href;
    return fetch(manifestUrl,{cache:'no-cache'}).then(function(res){if(!res.ok)throw new Error('Manifest returned HTTP '+res.status);return res.json();})
      .then(function(manifest){
        if(!manifest||!Array.isArray(manifest.files))throw new Error('manifest.files must be an array.');
        var files=manifest.files.filter(function(name){return typeof name==='string'&&/^[A-Za-z0-9._-]+\.json$/i.test(name);});
        return Promise.all(files.map(function(name){
          var url=new URL(name,manifestUrl).href;
          return fetch(url,{cache:'no-cache'}).then(function(res){if(!res.ok)throw new Error(name+' returned HTTP '+res.status);return res.json();})
            .then(function(raw){self.register(raw,name);}).catch(function(err){self.errors.push({source:name,messages:[err.message]});});
        }));
      }).catch(function(err){
        // The bundled inline data remains usable offline; manifest loading is additive.
        self.errors.push({source:'important-2-marks/manifest.json',messages:[err.message]});
      });
  },
  load:function(){this.units=[];this.byKey={};this.errors=[];this.loadInline();this.loadSaved();var self=this;return this.loadManifest().then(function(){self.units.sort(function(a,b){return a.subject.subjectCode.localeCompare(b.subject.subjectCode)||a.unit.unitNumber-b.unit.unitNumber;});});},
  getUnit:function(subjectCode,unitId){return this.byKey[String(subjectCode)+'::'+String(unitId)]||null;},
  groups:function(){
    var map={},order=[];
    this.units.forEach(function(raw){var code=raw.subject.subjectCode;if(!map[code]){map[code]={subject:raw.subject,units:[]};order.push(code);}map[code].units.push(raw);});
    return order.map(function(code){var g=map[code];g.units.sort(function(a,b){return a.unit.unitNumber-b.unit.unitNumber;});return g;});
  },
  importFiles:function(fileList){
    var self=this,files=Array.prototype.slice.call(fileList||[]),accepted=0,finished=0;
    if(!files.length)return;
    files.forEach(function(file){
      if(file.size>5*1024*1024){self.errors.push({source:file.name,messages:['File exceeds the 5 MB limit.']});finished++;done();return;}
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var raw=JSON.parse(String(reader.result||'')),problems=self.validate(raw),key=problems.length?'':self.key(raw);
          if(problems.length)self.errors.push({source:file.name,messages:problems});
          else if(self.byKey[key])self.errors.push({source:file.name,messages:['Duplicate unit '+key+' was skipped.']});
          else{
            var saved=Store.get('importantMarks',[]);if(!Array.isArray(saved))saved=[];saved.push(raw);
            var persisted=Store.set('importantMarks',saved);
            if(self.register(raw,file.name))accepted++;
            if(!persisted)toast('Unit loaded for this session, but browser storage is full.');
          }
        }catch(e){self.errors.push({source:file.name,messages:['Invalid JSON: '+e.message]});}
        finished++;done();
      };
      reader.onerror=function(){self.errors.push({source:file.name,messages:['The file could not be read.']});finished++;done();};
      reader.readAsText(file);
    });
    function done(){if(finished===files.length){self.units.sort(function(a,b){return a.subject.subjectCode.localeCompare(b.subject.subjectCode)||a.unit.unitNumber-b.unit.unitNumber;});Router.render();if(accepted)toast(accepted+' unit JSON file(s) added.');else toast('No new valid units were added.');}}
  }
};

/* ---- Import / validation / PDF reference resources ---- */
var Importer={
  pending:null,
  open:function(){
    this.pending=null;
    Modal.open({title:'Import data',html:
      '<h3>Structured JSON</h3><label class="drop"><input type="file" id="impFile" accept=".json,application/json">Choose a JSON file (versioned format, or the legacy “structured data” export)<div id="impName" class="note" style="margin-top:6px"></div></label><div id="impReport"></div>'+
      '<h3>Reference PDFs</h3><div class="note">PDFs are attached as reference resources only. Their text is <b>not</b> extracted — JSON is the source for all rendered content.</div>'+
      '<div class="row"><select class="field" id="pdfTarget" style="flex:1" aria-label="Attach PDF to">'+this.targets()+'</select></div>'+
      '<label class="drop"><input type="file" id="pdfFile" accept="application/pdf,.pdf" multiple>Attach PDF file(s)</label><div id="pdfList">'+this.pdfList()+'</div>'});
  },
  targets:function(){
    var h='<option value="">General (no specific unit)</option>';
    Registry.subjects.forEach(function(s){s.units.forEach(function(u){h+='<option value="'+esc(s.subjectId+'|'+u.unitId)+'">'+esc(s.subjectId+' – Unit '+roman(u.unitNumber)+': '+u.unitTitle)+'</option>';});});
    return h;
  },
  readFile:function(file,cb){var fr=new FileReader();fr.onload=function(){cb(null,fr.result);};fr.onerror=function(){cb(fr.error||new Error('Could not read file'));};return fr;},
  onJson:function(file){
    var self=this;$('impName').textContent=file.name+' ('+fmtBytes(file.size)+')';
    var fr=new FileReader();
    fr.onload=function(){
      var raw;try{raw=JSON.parse(fr.result);}catch(e){self.pending=null;$('impReport').innerHTML='<div class="report"><b class="e">Malformed JSON</b><ul><li class="e">'+esc(e.message)+'</li></ul></div>';return;}
      self.check(raw,file.name);
    };
    fr.onerror=function(){$('impReport').innerHTML='<div class="report"><b class="e">Could not read the file.</b></div>';};
    fr.readAsText(file);
  },
  plan:function(data){
    var plan=[];data.subjects.forEach(function(s){s.units.forEach(function(u){plan.push({sid:s.subjectId,uid:u.unitId,label:s.subjectId+' › Unit '+roman(u.unitNumber)+' ('+u.unitId+')',dup:Registry.hasUnit(s.subjectId,u.unitId)});});});
    return plan;
  },
  check:function(raw,name){
    var v=Validate.run(raw),h='<div class="report">';
    if(v.errors.length){h+='<b class="e">Validation failed — '+v.errors.length+' error'+(v.errors.length>1?'s':'')+'. Nothing was imported.</b><ul>'+v.errors.slice(0,40).map(function(x){return '<li class="e">'+esc(x)+'</li>';}).join('')+(v.errors.length>40?'<li>… and '+(v.errors.length-40)+' more</li>':'')+'</ul>';this.pending=null;}
    else{
      var sm=v.summary,plan=this.plan(v.data),nNew=plan.filter(function(p){return !p.dup;}).length,nDup=plan.length-nNew;
      h+='<b class="ok">Validation passed.</b> '+sm.subjects+' subject(s), '+sm.units+' unit(s), '+sm.partA+' Part A, '+sm.partB+' Part B questions (mapped), '+sm.subtopics+' subtopics.'+
        '<ul>'+plan.map(function(p){return '<li>'+esc(p.label)+' — '+(p.dup?'<span class="w">already exists (duplicate)</span>':'<span class="ok">new</span>')+'</li>';}).join('')+'</ul>';
      this.pending={data:v.data,name:name,plan:plan};
      h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" data-act="commit-import" data-mode="new"'+(nNew?'':' disabled')+'>Import '+nNew+' new unit'+(nNew===1?'':'s')+'</button>'+
        (nDup?'<button class="btn" data-act="commit-import" data-mode="replace">Import &amp; replace '+nDup+' duplicate'+(nDup===1?'':'s')+'</button>':'')+'</div>'+
        (nDup?'<div class="note" style="margin-top:8px">Duplicates are skipped by default. Replacing keeps your study progress for IDs that still exist.</div>':'');
    }
    if(v.warnings.length)h+='<div style="margin-top:10px"><b class="w">'+v.warnings.length+' warning'+(v.warnings.length>1?'s':'')+'</b><ul>'+v.warnings.slice(0,25).map(function(x){return '<li class="w">'+esc(x)+'</li>';}).join('')+'</ul></div>';
    $('impReport').innerHTML=h+'</div>';
  },
  commit:function(mode){
    var p=this.pending;if(!p)return;var dupOk=mode==='replace',added=0,replaced=0,skipped=0,subjects=[];
    p.data.subjects.forEach(function(s){
      var us=s.units.filter(function(u){var dup=Registry.hasUnit(s.subjectId,u.unitId);if(dup&&!dupOk){skipped++;return false;}dup?replaced++:added++;return true;});
      if(us.length){var c=clone(s);c.units=clone(us);subjects.push(c);}});
    if(!subjects.length){toast('Nothing to import: all units already exist.');return;}
    var before=clone(Registry.packages);
    Registry.packages.push({id:'pkg'+Date.now().toString(36),fileName:p.name,importedAt:new Date().toISOString(),schemaVersion:p.data.schemaVersion||SCHEMA_VERSION,subjects:subjects});
    if(!Registry.savePackages()){Registry.packages=before;toast('Could not save: browser storage is full. Remove old imports in Settings.');return;}
    Registry.rebuild();this.pending=null;Modal.close();Router.render();
    toast('Imported '+added+' new'+(replaced?', replaced '+replaced:'')+(skipped?', skipped '+skipped+' duplicate(s)':'')+' unit(s).');
  },
  pdfList:function(){
    if(!UI.res.length)return '<div class="empty-note">No reference PDFs attached.</div>';
    return UI.res.map(function(r){return '<div class="row"><div><div>'+esc(r.name)+'</div><div class="sub">'+fmtBytes(r.size)+' · '+(r.sid?esc(r.sid+' / '+r.uid):'General')+' · '+(r.persisted?'saved offline':'this session only (too large to store)')+'</div></div>'+
      '<div style="display:flex;gap:4px"><button class="btn" data-act="open-pdf" data-id="'+esc(r.id)+'">Open</button><button class="icon-btn" data-act="remove-pdf" data-id="'+esc(r.id)+'" aria-label="Remove">'+icon('trash')+'</button></div></div>';}).join('');
  },
  addPdfs:function(files){
    var tgt=($('pdfTarget').value||'').split('|'),n=0;
    Array.prototype.forEach.call(files,function(f){
      if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast('“'+f.name+'” is not a PDF.');return;}
      if(UI.res.some(function(r){return r.name===f.name&&r.size===f.size&&r.sid===(tgt[0]||null)&&r.uid===(tgt[1]||null);})){toast('Duplicate: “'+f.name+'” is already attached here.');return;}
      var rec={id:'r'+Date.now().toString(36)+(n++),name:f.name,size:f.size,added:new Date().toISOString(),sid:tgt[0]||null,uid:tgt[1]||null,persisted:false};
      UI.blobs=UI.blobs||{};UI.blobs[rec.id]=f;
      function fin(){UI.res.push(rec);Store.set('resources',UI.res);var l=$('pdfList');if(l)l.innerHTML=Importer.pdfList();toast('Attached “'+f.name+'” as a reference (text not extracted).');}
      if(f.size<=1200000){var fr=new FileReader();fr.onload=function(){rec.persisted=Store.set('res:'+rec.id,fr.result);fin();};fr.onerror=fin;fr.readAsDataURL(f);}else fin();
    });
  },
  openPdf:function(id){
    var r=UI.res.filter(function(x){return x.id===id;})[0];if(!r)return;
    var blob=UI.blobs&&UI.blobs[id];
    if(!blob){var d=Store.get('res:'+id,null);if(d){try{var a=d.split(','),bin=atob(a[1]),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);blob=new Blob([u8],{type:'application/pdf'});}catch(e){}}}
    if(!blob){toast('This PDF was too large to store. Attach it again to open it.');return;}
    window.open(URL.createObjectURL(blob),'_blank');
  },
  removePdf:function(id){UI.res=UI.res.filter(function(r){return r.id!==id;});Store.del('res:'+id);Store.set('resources',UI.res);if(UI.blobs)delete UI.blobs[id];var l=$('pdfList');if(l)l.innerHTML=this.pdfList();}
};

  'open-sidebar':function(){if(isMobile()){$('sidebar').classList.add('mobile-open');$('scrim').classList.add('show');}else{$('sidebar').classList.remove('collapsed');UI.ui.collapsed=false;saveUI();}},
  'close-sidebar':function(){if(isMobile())closeMobile();else{$('sidebar').classList.add('collapsed');UI.ui.collapsed=true;saveUI();}},
  'search':function(){Modal.close();SearchUI.open();},
  'import':function(){$('profileMenu').classList.remove('open');Importer.open();},
  'settings':function(){$('profileMenu').classList.remove('open');openSettings();},
  'about':function(){$('profileMenu').classList.remove('open');openAbout();},
  'theme':function(){UI.ui.theme=UI.ui.theme==='light'?'dark':'light';saveUI();applyTheme();$('profileMenu').classList.remove('open');},
  'set-theme':function(b){UI.ui.theme=b.dataset.v;saveUI();applyTheme();document.querySelectorAll('#themeSeg button').forEach(function(x){x.classList.toggle('on',x===b);});},
  'profile-menu':function(){$('profileMenu').classList.toggle('open');},
  'modal-close':function(){Modal.close();},
  'modal-bg':function(b,e){if(e.target===b)Modal.close();},
  'toggle-subject':function(b){UI.ui.open=UI.ui.open||{};var id=b.dataset.id;UI.ui.open[id]=!(UI.ui.open[id]||(UI.route.sid===id));saveUI();Shell.sidebar();},
  'copy-code':function(b){var ta=b.closest('.codeblock').querySelector('textarea');copyText(ta.value,function(){toast('Code copied');});},
  'copy-answer':function(b){
    var it=findItem(b.dataset.kind,b.dataset.id);if(!it)return;
    var t=b.dataset.kind==='a'?it.answer:it.sections.map(function(s){return s.heading+'\n'+s.content;}).join('\n\n');copyText(it.id+'. '+it.question+'\n\n'+t,function(){toast('Answer copied');});},
  'copy-important-answer':function(b){
    var raw=ImportantMarks.getUnit(b.dataset.subject,b.dataset.unit);if(!raw)return;
    var q=raw.importantTwoMarks.filter(function(x){return x.questionId===b.dataset.id;})[0];if(!q)return;
    copyText('Q'+q.questionNumber+'. '+q.question+'\n\n'+q.answer,function(){toast('Answer copied');});
  },
  'important-marks':function(){if(isMobile())closeMobile();Nav.to('#/important-2-marks');},
  'reset-unit':function(){var r=UI.route;if(confirm('Reset all progress for this unit?')){Progress.reset(r.sid,r.uid);Router.render();toast('Unit progress reset');}},
  'reset-all':function(){if(confirm('Reset ALL study progress? This cannot be undone.')){Progress.reset();Router.render();toast('All progress reset');}},
  'remove-pkg':function(b){if(!confirm('Remove this imported file and its units? Study progress is kept.'))return;Registry.packages=Registry.packages.filter(function(p){return p.id!==b.dataset.id;});Registry.savePackages();Registry.rebuild();Modal.close();var r=UI.route;if(r.sid&&!Registry.subject(r.sid))Nav.to('#/');else Router.render();toast('Import removed');},
  'commit-import':function(b){Importer.commit(b.dataset.mode);},
  'open-pdf':function(b){Importer.openPdf(b.dataset.id);},
  'remove-pdf':function(b){Importer.removePdf(b.dataset.id);Router.render();},
  'export':function(){
    var blob=new Blob([JSON.stringify({format:'academic-study-hub-backup',appVersion:APP_VERSION,storageVersion:STORAGE_VERSION,exported:new Date().toISOString(),progress:Progress.data,library:Registry.packages,resources:UI.res},null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study-hub-backup.json';document.body.appendChild(a);a.click();a.remove();}
};
function bindEvents(){
  document.addEventListener('click',function(e){
    var t=e.target;
    var a=t.closest&&t.closest('a[data-nav]');
    if(a){e.preventDefault();Modal.close();if(isMobile())closeMobile();Nav.to(a.getAttribute('href'));return;}
    var b=t.closest&&t.closest('[data-act]');
    if(b&&Actions[b.dataset.act]){e.stopPropagation();Actions[b.dataset.act](b,e);return;}
    if(!(t.closest&&t.closest('#profileMenu')))$('profileMenu').classList.remove('open');
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches&&t.matches('input[type=checkbox][data-kind]')){
      var r=UI.route;if(!Progress.set(t.dataset.kind,r.sid,r.uid,t.dataset.id,t.checked)){toast('Could not save progress (storage unavailable).');}
      Shell.progress();
    }else if(t.id==='impFile'&&t.files[0]){Importer.onJson(t.files[0]);t.value='';}
    else if(t.id==='importantJsonFiles'&&t.files.length){ImportantMarks.importFiles(t.files);t.value='';}
    else if(t.id==='pdfFile'&&t.files.length){Importer.addPdfs(t.files);t.value='';}
  });
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Modal.close();SearchUI.open();return;}
    if(e.key==='Escape'){if(Modal.isOpen())Modal.close();else{closeMobile();$('profileMenu').classList.remove('open');}return;}
    if(Modal.isOpen()&&e.target&&e.target.id==='sInput')SearchUI.key(e);
  });
  window.addEventListener('hashchange',function(){Router.render();});
}

/* ---- Boot ---- */
function boot(){
  Store.migrate();
  UI.ui=Store.get('ui',{})||{};UI.res=Store.get('resources',[])||[];
  var seed=null;try{seed=JSON.parse($('seed-data').textContent);}catch(e){seed=null;}
  var v=seed?Validate.run(seed):null;
  Registry.load(v&&v.data?v.data:{subjects:[]});
  if(seed&&v&&!v.data)console.error('Seed data failed validation',v.errors);
  Progress.load();
  hydrateIcons();applyTheme();
  if(UI.ui.collapsed&&!isMobile())$('sidebar').classList.add('collapsed');
  bindEvents();
  if(!location.hash&&UI.ui.last&&/^#\//.test(UI.ui.last)){history.replaceState(null,'',UI.ui.last);}
  Router.render();
  ImportantMarks.load().then(function(){if(UI.route.feature==='important-2-marks')Router.render();});
}

root.ASH={Store:Store,Validate:Validate,Registry:Registry,Progress:Progress,Search:Search,Md:Md,fromLegacy:fromLegacy,roman:roman,Nav:Nav,VERSION:APP_VERSION};
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('app'))boot();
})(typeof window!=='undefined'?window:globalThis);
</script>
</body>
