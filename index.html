<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CS3551 – Distributed Computing | Academic Study Hub</title>
  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --composer: #303030;
      --surface: #2a2a2a;
      --hover: #303030;
      --text: #f5f5f5;
      --text2: #b4b4b4;
      --muted: #858585;
      --border: #383838;
      --success: #19c37d;
      --warn: #e8b04a;
      --danger: #f0605d;
      --code: #161616;
      --codehead: #222;
      --bubble: #303030;
      --elev: #2b2b2b;
      --inlinecode: #2f2f2f;
      --tablebg: #1d1d1d;
      --th: #262626;
      --link: #7ab7ff;
      --purple: #8b7cf6;
      --purple-bg: rgba(139, 124, 246, .12);
      --primary: #fff;
      --onprimary: #111;
      --radius: 12px;
      --sbw: 272px;
      --mark: rgba(232, 176, 74, .35);
      --flash: rgba(122, 183, 255, .22);
      --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    html[data-theme="light"] {
      --bg: #ffffff;
      --sidebar: #f9f9f9;
      --composer: #f4f4f4;
      --surface: #f4f4f4;
      --hover: #ececec;
      --text: #0d0d0d;
      --text2: #5d5d5d;
      --muted: #8e8e8e;
      --border: #e3e3e3;
      --code: #f7f7f7;
      --codehead: #eee;
      --bubble: #f0f0f0;
      --elev: #ffffff;
      --inlinecode: #ececec;
      --tablebg: #fafafa;
      --th: #f0f0f0;
      --link: #1a6fd1;
      --purple-bg: rgba(139, 124, 246, .1);
      --primary: #0d0d0d;
      --onprimary: #fff;
      --flash: rgba(26, 111, 209, .14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      color: inherit
    }

    button {
      background: none;
      border: 0;
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    svg {
      display: block;
      flex-shrink: 0
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    :focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 2px
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden
    }

    /* Sidebar */
    .sidebar {
      width: var(--sbw);
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left .2s ease;
      z-index: 30;
      height: 100%
    }

    .sidebar.collapsed {
      margin-left: calc(var(--sbw) * -1)
    }

    .sb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px 8px 14px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--text2);
      flex-shrink: 0
    }

    .icon-btn:hover {
      background: var(--hover);
      color: var(--text)
    }

    .sb-nav {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 14px;
      text-align: left;
      width: 100%
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--hover)
    }

    .nav-item kbd {
      margin-left: auto;
      font: 11px var(--mono);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px
    }

    .sb-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 10px
    }

    .hgroup {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      padding: 14px 10px 6px
    }

    .subj-row {
      display: flex;
      align-items: center;
      border-radius: 9px
    }

    .subj-row:hover,
    .subj-row.active {
      background: var(--hover)
    }

    .subj-link {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      font-size: 14px
    }

    .subj-link b {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .01em
    }

    .subj-link span {
      font-size: 13px;
      color: var(--text2);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .subj-toggle {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--text2);
      margin-right: 4px
    }

    .subj-toggle .icon {
      transition: transform .15s;
      width: 16px;
      height: 16px
    }

    .subj.open .subj-toggle .icon {
      transform: rotate(180deg)
    }

    .units {
      display: none;
      padding: 2px 0 6px 12px;
      margin-left: 10px;
      border-left: 1px solid var(--border)
    }

    .subj.open .units {
      display: block
    }

    .unit-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--text)
    }

    .unit-link span.t {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .unit-link:hover,
    .unit-link.active {
      background: var(--hover)
    }

    .unit-link .pct {
      font-size: 12px;
      color: var(--muted)
    }

    .unit-link .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--muted);
      flex-shrink: 0
    }

    .unit-link .dot.done {
      background: var(--success);
      border-color: var(--success)
    }

    .unit-link .dot.prog {
      border-color: var(--warn);
      background: linear-gradient(90deg, var(--warn) 50%, transparent 50%)
    }

    .empty-note {
      font-size: 13px;
      color: var(--muted);
      padding: 10px
    }

    .sb-bottom {
      padding: 10px;
      border-top: 1px solid var(--border);
      position: relative
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      width: 100%;
      text-align: left
    }

    .profile:hover {
      background: var(--hover)
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6b6b6b, #3d3d3d);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0
    }

    .pname {
      font-size: 14px;
      font-weight: 500
    }

    .psub {
      font-size: 12px;
      color: var(--muted)
    }

    .menu {
      position: absolute;
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      min-width: 220px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
      z-index: 60;
      display: none
    }

    .menu.open {
      display: block
    }

    .menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 14px;
      text-align: left
    }

    .menu button:hover {
      background: var(--hover)
    }

    .menu hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 5px 0
    }

    #profileMenu {
      bottom: 68px;
      left: 10px;
      right: 10px
    }

    .scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 25
    }

    /* Main */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      height: 56px;
      flex-shrink: 0;
      gap: 8px
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden
    }

    .crumbs a:hover {
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .crumbs .sep {
      color: var(--muted);
      font-weight: 400
    }

    .crumbs .cur {
      overflow: hidden;
      text-overflow: ellipsis
    }

    .crumbs .muted {
      color: var(--text2);
      font-weight: 500
    }

    #sbOpen {
      display: none
    }

    .sidebar.collapsed~.main #sbOpen {
      display: grid
    }

    .header-right {
      display: flex;
      gap: 4px
    }

    .scroller {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 20px 48px
    }

    .page.wide {
      max-width: 960px
    }

    /* Home / dashboards */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 34px 0 20px
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -.01em
    }

    .hero p {
      color: var(--text2);
      max-width: 520px;
      line-height: 1.55
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text2)
    }

    .stat b {
      display: block;
      font-size: 20px;
      color: var(--text);
      font-weight: 600
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 16px
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
      transition: background .15s, border-color .15s;
      min-height: 150px
    }

    .card:hover {
      background: var(--hover);
      border-color: var(--muted)
    }

    .card .k {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: .04em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .card h3 {
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.35
    }

    .card .meta {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6
    }

    .card .grow {
      flex: 1
    }

    .bar {
      height: 6px;
      border-radius: 6px;
      background: var(--border);
      overflow: hidden
    }

    .bar>i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--success);
      border-radius: 6px;
      transition: width .25s
    }

    .pcrow {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text2);
      margin-top: 6px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text2);
      white-space: nowrap
    }

    .chip.done {
      color: var(--success);
      border-color: rgba(25, 195, 125, .5)
    }

    .chip.prog {
      color: var(--warn);
      border-color: rgba(232, 176, 74, .5)
    }

    .chip.none {
      color: var(--muted)
    }

    .page-title {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.01em;
      margin: 14px 0 4px
    }

    .page-sub {
      color: var(--text2);
      font-size: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 6px
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--surface);
      margin: 14px 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text)
    }

    .btn:hover {
      background: var(--hover)
    }

    .btn.primary {
      background: var(--primary);
      color: var(--onprimary);
      border-color: transparent;
      font-weight: 550
    }

    .btn.primary:hover {
      opacity: .88;
      background: var(--primary)
    }

    .btn.danger {
      color: var(--danger)
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed
    }

    .btn .icon {
      width: 16px;
      height: 16px
    }

    /* Unit view */
    .unit-head {
      margin: 10px 0 4px
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 14px 0 6px;
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 8px 0 10px;
      z-index: 5
    }

    .tab {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      border: 1px solid var(--border);
      color: var(--text2);
      display: inline-flex;
      gap: 8px;
      align-items: center
    }

    .tab:hover {
      background: var(--hover);
      color: var(--text)
    }

    .tab.active {
      background: var(--composer);
      color: var(--text);
      border-color: var(--muted)
    }

    .tab em {
      font-style: normal;
      font-size: 12px;
      color: var(--muted)
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin: 6px 0 14px
    }

    .jump {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .jump a {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text2)
    }

    .jump a:hover {
      background: var(--hover);
      color: var(--text)
    }

    .qa {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 84px;
      border-radius: 12px;
      transition: background .5s
    }

    .qa:last-child {
      border-bottom: 0
    }

    .qa.flash,
    .flash {
      background: var(--flash)
    }

    .msg-user {
      align-self: flex-end;
      max-width: 88%;
      background: var(--bubble);
      padding: 10px 18px;
      border-radius: 22px;
      line-height: 1.55;
      overflow-wrap: anywhere
    }

    .qid {
      display: inline-block;
      font: 600 12px var(--mono);
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 7px;
      margin-right: 10px;
      vertical-align: 1px
    }

    .msg-ai {
      display: flex;
      gap: 14px;
      align-items: flex-start
    }

    .ai-avatar {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 2px
    }

    .ai-avatar svg {
      width: 18px;
      height: 18px
    }

    .ai-body {
      flex: 1;
      min-width: 0
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      color: var(--text2);
      align-items: center;
      flex-wrap: wrap
    }

    .actions .icon-btn {
      width: 32px;
      height: 32px
    }

    .ahead {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .ahead .grow {
      flex: 1
    }

    .answer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .05em;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--onprimary)
    }

    .answer-link:hover {
      opacity: .85
    }

    .answer-link .icon {
      width: 14px;
      height: 14px;
      stroke-width: 2.4
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text2)
    }

    .back-link:hover {
      background: var(--hover);
      color: var(--text)
    }

    .back-link .icon {
      width: 14px;
      height: 14px
    }

    .mini {
      font-size: 12.5px;
      color: var(--text2);
      white-space: nowrap
    }

    .mini-bar {
      width: 90px
    }

    .cl-title {
      font-weight: 650;
      margin: 6px 0 6px
    }

    .checks {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .check,
    .learn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.4;
      scroll-margin-top: 80px;
      transition: background .5s;
      user-select: none
    }

    .check:hover,
    .learn:hover {
      background: var(--hover)
    }

    .check input,
    .learn input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0
    }

    .box {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.7px solid var(--muted);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      transition: background .12s, border-color .12s
    }

    .box svg {
      width: 14px;
      height: 14px;
      stroke: #0b1f16;
      stroke-width: 3.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0
    }

    input:checked+.box {
      background: var(--success);
      border-color: var(--success)
    }

    input:checked+.box svg {
      opacity: 1
    }

    input:focus-visible+.box {
      outline: 2px solid var(--muted);
      outline-offset: 2px
    }

    .check input:checked~.lbl {
      color: var(--text2);
      text-decoration: line-through;
      text-decoration-color: var(--muted)
    }

    .learn {
      display: inline-flex;
      font-size: 13.5px;
      padding: 5px 12px 5px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      gap: 8px;
      color: var(--text2)
    }

    .learn .box {
      width: 18px;
      height: 18px;
      border-radius: 5px
    }

    .learn .box svg {
      width: 12px;
      height: 12px
    }

    .note {
      font-size: 13px;
      color: var(--text2);
      margin: 2px 0 8px
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      color: var(--text2);
      margin: 20px 0;
      line-height: 1.6
    }

    .ans-sec {
      scroll-margin-top: 80px;
      border-radius: 10px;
      padding: 2px 0;
      transition: background .5s
    }

    .diagram {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      background: var(--surface);
      margin: 0 0 18px
    }

    .diagram figcaption {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 10px;
      font-weight: 600
    }

    .flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px
    }

    .node {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--muted);
      background: var(--bg);
      font-size: 13.5px;
      font-weight: 550
    }

    .arrow {
      color: var(--muted);
      font-size: 18px
    }

    .dnote {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text2)
    }

    .marks {
      font-size: 12px;
      font-weight: 600;
      color: var(--purple);
      border: 1px solid var(--purple);
      border-radius: 999px;
      padding: 2px 10px
    }

    .pdfs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0
    }

    /* Markdown */
    .md {
      line-height: 1.7;
      font-size: 16px;
      color: var(--text);
      overflow-wrap: anywhere
    }

    .md>*+* {
      margin-top: 14px
    }

    .md h1 {
      font-size: 1.6rem;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .md h2 {
      font-size: 1.25rem;
      line-height: 1.35;
      font-weight: 650;
      margin-top: 22px
    }

    .md h3 {
      font-size: 1.08rem;
      font-weight: 650;
      margin-top: 18px
    }

    .md h1+*,
    .md h2+*,
    .md h3+* {
      margin-top: 10px
    }

    .md strong {
      font-weight: 650
    }

    .md em {
      font-style: italic
    }

    .md del {
      color: var(--muted)
    }

    .md a {
      color: var(--link)
    }

    .md a:hover {
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .md ul,
    .md ol {
      padding-left: 26px
    }

    .md li {
      margin: 5px 0;
      padding-left: 4px
    }

    .md li::marker {
      color: var(--text2)
    }

    .md ul ul,
    .md ol ul,
    .md ul ol,
    .md ol ol {
      margin: 4px 0
    }

    .md code {
      font-family: var(--mono);
      font-size: .88em;
      background: var(--inlinecode);
      padding: 2px 6px;
      border-radius: 6px;
      overflow-wrap: anywhere
    }

    .md .formula {
      background: var(--tablebg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--purple);
      border-radius: 10px;
      padding: 10px 14px;
      overflow-x: auto
    }

    .md .formula code {
      background: none;
      padding: 0;
      font-size: .95em;
      white-space: pre-wrap
    }

    .md hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 22px 0
    }

    .md blockquote {
      border-left: 3px solid var(--purple);
      background: var(--purple-bg);
      padding: 12px 16px;
      border-radius: 0 10px 10px 0
    }

    .md blockquote>*+* {
      margin-top: 8px
    }

    .codeblock {
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px 6px 14px;
      background: var(--codehead);
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text2);
      font-family: var(--mono)
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text2);
      font-family: var(--font)
    }

    .copy-btn:hover {
      background: var(--hover);
      color: var(--text)
    }

    .copy-btn .icon {
      width: 14px;
      height: 14px
    }

    .codeblock pre {
      padding: 14px 16px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.65;
      tab-size: 4
    }

    .codeblock code {
      background: none;
      padding: 0;
      font-size: inherit;
      border-radius: 0
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--tablebg)
    }

    .md table {
      border-collapse: collapse;
      width: 100%;
      min-width: 360px;
      font-size: 14.5px;
      line-height: 1.5
    }

    .md th,
    .md td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      vertical-align: top
    }

    .md th:last-child,
    .md td:last-child {
      border-right: 0
    }

    .md tr:last-child td {
      border-bottom: 0
    }

    .md th {
      background: var(--th);
      font-weight: 650;
      white-space: nowrap
    }

    .md .math {
      font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
      font-style: italic;
      white-space: nowrap
    }

    .md .mblock {
      display: block;
      text-align: center;
      padding: 14px;
      background: var(--tablebg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto
    }

    .md .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      margin: 0 3px;
      font-size: .92em
    }

    .md .frac>span:first-child {
      border-bottom: 1px solid currentColor
    }

    .md img {
      max-width: 100%;
      border-radius: 10px
    }

    mark {
      background: var(--mark);
      color: inherit;
      border-radius: 3px;
      padding: 0 1px
    }

    /* IMPORTANT 2 MARKS — additive feature styles */
    .imp-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 18px
    }

    .imp-unit-card {
      min-height: 146px
    }

    .imp-unit-card .meta {
      margin-top: 2px
    }

    .imp-unit-title {
      font-size: 16px;
      font-weight: 650;
      line-height: 1.4
    }

    .imp-question {
      font-size: 15px;
      color: var(--text2)
    }

    .imp-qa {
      gap: 14px
    }

    .imp-qa .msg-user {
      font-weight: 600;
      line-height: 1.55
    }

    .imp-qmeta {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 2px
    }

    .imp-qmeta .chip {
      font-size: 11.5px
    }

    .imp-source-note {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 12px
    }

    .imp-upload {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .imp-upload input {
      display: none
    }

    .imp-warning {
      border: 1px solid rgba(232, 176, 74, .45);
      background: rgba(232, 176, 74, .07);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text2);
      font-size: 13px;
      line-height: 1.5;
      margin: 12px 0
    }

    @media(max-width:820px) {
      .imp-qa .msg-user {
        max-width: 96%
      }

      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .data-grid {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:560px) {

      .gallery-grid,
      .case-grid {
        grid-template-columns: 1fr
      }

      .gallery-card img {
        height: 160px
      }

      .priority-item {
        grid-template-columns: 68px minmax(0, 1fr)
      }

      .priority-item .btn {
        grid-column: 2;
        justify-self: start
      }
    }


    /* DIAGRAMS — technical architecture visualizer */
    .diagram-hero {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(139, 124, 246, .42);
      border-radius: 20px;
      padding: 22px;
      background: radial-gradient(ellipse at 10% 0%, rgba(69, 105, 255, .22), transparent 48%), radial-gradient(ellipse at 95% 100%, rgba(151, 63, 255, .18), transparent 42%), var(--surface);
      margin-bottom: 18px
    }

    .diagram-hero:after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, .035), transparent 65%)
    }

    .diagram-hero h1 {
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -.035em
    }

    .diagram-hero p {
      color: var(--text2);
      margin-top: 7px;
      max-width: 720px;
      line-height: 1.6
    }

    .diagram-unit {
      margin: 24px 0 10px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .diagram-unit h2 {
      font-size: 19px
    }

    .diagram-unit .line {
      height: 1px;
      background: var(--border);
      flex: 1
    }

    .diagram-topic {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--elev);
      padding: 16px;
      margin: 12px 0 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .12)
    }

    .diagram-topic-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .diagram-topic-head h3 {
      font-size: 17px
    }

    .diagram-topic-head p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px
    }

    .diagram-card {
      border: 1px solid rgba(92, 135, 255, .28);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(10, 25, 58, .9), rgba(13, 17, 43, .94));
      margin-top: 12px;
      color: #edf4ff
    }

    .diagram-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(117, 153, 255, .22);
      background: linear-gradient(90deg, rgba(31, 89, 180, .28), rgba(112, 57, 205, .18))
    }

    .diagram-card-top strong {
      font-size: 14px
    }

    .diagram-card-top span {
      font-size: 11px;
      color: #a9c7ff;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .diagram-canvas {
      padding: 18px 12px 14px;
      overflow-x: auto;
      background-image: radial-gradient(rgba(132, 168, 255, .15) 1px, transparent 1px);
      background-size: 18px 18px
    }

    .diagram-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      min-width: max-content;
      margin: auto;
      padding: 12px 8px 18px
    }

    .diagram-node {
      width: 142px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      border: 1px solid #5b8cff;
      border-radius: 12px;
      background: linear-gradient(150deg, #142f60, #17234a);
      box-shadow: 0 0 18px rgba(54, 132, 255, .18);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35
    }

    .diagram-node small {
      font-size: 10px;
      color: #b6ceff;
      font-weight: 500;
      margin-top: 4px
    }

    .diagram-node:nth-of-type(4n+1) {
      border-color: #9c75ff;
      box-shadow: 0 0 18px rgba(156, 117, 255, .2)
    }

    .diagram-node:nth-of-type(4n+2) {
      border-color: #22c8df
    }

    .diagram-node:nth-of-type(4n+3) {
      border-color: #42d6a0
    }

    .diagram-arrow {
      width: 68px;
      flex: 0 0 68px;
      text-align: center;
      color: #53d7f3;
      font-size: 22px;
      position: relative
    }

    .diagram-arrow small {
      display: block;
      font-size: 9px;
      line-height: 1.2;
      color: #c3d5ff;
      max-width: 70px;
      white-space: normal;
      margin: auto
    }

    .diagram-note {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 10px 14px;
      color: #b9c9e9;
      font-size: 11px;
      line-height: 1.5;
      border-top: 1px solid rgba(117, 153, 255, .18)
    }

    .diagram-legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 14px 13px
    }

    .diagram-legend span {
      font-size: 10px;
      color: #c5d8ff;
      border: 1px solid rgba(139, 174, 255, .25);
      border-radius: 99px;
      padding: 4px 8px
    }

    .diagram-index {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0
    }

    .diagram-index a {
      font-size: 12px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--text2)
    }

    .diagram-index a:hover {
      border-color: var(--purple);
      color: var(--text)
    }

    @media(max-width:650px) {
      .diagram-hero {
        padding: 17px
      }

      .diagram-topic {
        padding: 11px
      }

      .diagram-flow {
        justify-content: flex-start
      }

      .diagram-node {
        width: 118px;
        min-height: 72px;
        font-size: 12px
      }

      .diagram-arrow {
        width: 48px;
        flex-basis: 48px
      }

      .diagram-card-top {
        align-items: flex-start;
        flex-direction: column
      }
    }

    /* Modals */
    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 80;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 6vh 14px 14px;
      overflow-y: auto
    }

    .modal {
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      display: flex;
      flex-direction: column;
      max-height: 88vh
    }

    .modal.search {
      max-width: 680px
    }

    .modal.image-viewer {
      max-width: 96vw;
      width: 96vw;
      max-height: 94vh;
      background: #111;
      border-color: #444
    }

    .modal.image-viewer .modal-head {
      background: #111;
      color: #fff;
      border-color: #333
    }

    .modal.image-viewer .modal-body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      padding: 10px
    }

    .modal.image-viewer .modal-body img {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 8px;
      background: #fff
    }

    .dc-source-img,
    .md img {
      cursor: zoom-in
    }

    .dc-source-img:hover,
    .md img:hover {
      outline: 1px solid var(--muted);
      outline-offset: 2px
    }

    /* CS3551 source-data presentation, styled to the reference UI theme */
    .answer-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      overflow-wrap: anywhere
    }

    .structured {
      margin: 10px 0 14px
    }

    .structured h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 0 0 7px
    }

    .structured ul {
      padding-left: 22px;
      margin: 5px 0
    }

    .structured li {
      font-size: 14px;
      line-height: 1.65;
      margin: 4px 0;
      color: var(--text2)
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 7px
    }

    .data-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      background: var(--bg);
      min-width: 0
    }

    .data-card b {
      font-size: 12px;
      display: block;
      margin-bottom: 4px
    }

    .data-card p {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text2);
      margin: 3px 0;
      overflow-wrap: anywhere
    }

    .data-card strong {
      color: var(--text)
    }

    .code-pre {
      font: 12px/1.65 var(--mono);
      white-space: pre-wrap;
      overflow: auto;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      margin: 8px 0;
      color: var(--text2)
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px
    }

    .gallery-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
      background: var(--surface);
      min-width: 0
    }

    .gallery-card img {
      width: 100%;
      height: 175px;
      object-fit: contain;
      background: #f7f9fc;
      display: block
    }

    .gallery-copy {
      padding: 11px
    }

    .gallery-copy b {
      font-size: 12px;
      display: block;
      line-height: 1.45
    }

    .gallery-copy span {
      font-size: 10.5px;
      color: var(--muted);
      display: block;
      margin-top: 5px;
      line-height: 1.5;
      overflow-wrap: anywhere
    }

    .first-cover-unit {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: var(--surface);
      margin: 11px 0
    }

    .first-cover-unit h3 {
      font-size: 14px;
      margin: 0 0 10px
    }

    .priority-list {
      display: grid;
      gap: 7px
    }

    .priority-item {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: var(--bg)
    }

    .priority-number {
      font-size: 9px;
      color: var(--warn);
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .priority-item strong {
      font-size: 12px;
      display: block
    }

    .priority-item small {
      font-size: 10.5px;
      color: var(--muted);
      display: block;
      margin-top: 4px;
      line-height: 1.5
    }

    .priority-item .btn {
      padding: 6px 9px;
      font-size: 11px
    }

    .case-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px
    }

    .case-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      background: var(--surface)
    }

    .case-card h3 {
      font-size: 13px;
      margin: 0 0 6px
    }

    .case-card p {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.65;
      margin: 0
    }

    .structured .md {
      font-size: 15px
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 6px 20px
    }

    .modal-head h2 {
      font-size: 17px;
      font-weight: 650
    }

    .modal-body {
      padding: 6px 20px 20px;
      overflow-y: auto
    }

    .modal-body h3 {
      font-size: 14px;
      margin: 18px 0 8px;
      color: var(--text2);
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 14.5px
    }

    .row .sub {
      font-size: 12.5px;
      color: var(--muted)
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden
    }

    .seg button {
      padding: 6px 14px;
      font-size: 13.5px;
      color: var(--text2)
    }

    .seg button.on {
      background: var(--composer);
      color: var(--text)
    }

    .field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      outline: none
    }

    .field:focus {
      border-color: var(--muted)
    }

    .res-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 10px;
      max-height: 56vh;
      overflow-y: auto
    }

    .res {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px
    }

    .res:hover,
    .res.sel {
      background: var(--hover)
    }

    .res .rt {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 550
    }

    .res .rt span.t {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .res .rs {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.5
    }

    .res .rc {
      font-size: 12px;
      color: var(--muted)
    }

    .pill {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 6px;
      color: var(--text2);
      flex-shrink: 0
    }

    .report {
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      margin-top: 12px;

            if (f.size <= 1200000) { var fr = new FileReader(); fr.onload = function () { rec.persisted = Store.set('res:' + rec.id, fr.result); fin(); }; fr.onerror = fin; fr.readAsDataURL(f); } else fin();
          });

        openPdf: function (id) {

          var blob = UI.blobs && UI.blobs[id];

        removePdf: function (id) { UI.res = UI.res.filter(function (r) { return r.id !== id; }); Store.del('res:' + id); Store.set('resources', UI.res); if (UI.blobs) delete UI.blobs[id]; var l = $('pdfList'); if (l) l.innerHTML = this.pdfList(); }

      function openSettings() {
        var th = UI.ui.theme || 'dark', h = '<h3>Appearance</h3><div class="row"><span>Candidate ID</span><span class="std-lbl">stUDENT-421624243076</span></div><div class="row"><span>Theme</span><div class="seg" id="themeSeg"><button data-act="set-theme" data-v="dark" class="' + (th === 'dark' ? 'on' : '') + '">Dark</button><button data-act="set-theme" data-v="light" class="' + (th === 'light' ? 'on' : '') + '">Light</button></div></div>' +
          '<h3>Study progress</h3><div class="row"><div>Reset all progress<div class="sub">Clears every checklist and “learned” mark. Imported content is kept.</div></div><button class="btn danger" data-act="reset-all">Reset</button></div>' +
          '<h3>Imported data</h3>';
        if (!Registry.packages.length) h += '<div class="empty-note">No imported files. Built-in sample data is always available.</div>';

          h += '<div class="row"><div>' + esc(p.fileName) + '<div class="sub">' + n + ' unit(s) · ' + esc(p.importedAt.slice(0, 10)) + '</div></div><button class="btn danger" data-act="remove-pkg" data-id="' + esc(p.id) + '">Remove</button></div>';
        });

          '<div class="row"><div>Local storage used<div class="sub">Browser limit is about 5 MB; larger libraries need the IndexedDB migration path (see README)</div></div><span class="mini">' + fmtBytes(Store.usage()) + '</span></div>';

      function openAbout() {

            '<div class="note" style="margin-top:10px">Runs fully offline. No network requests, libraries or external fonts. Progress and imported data are stored in this browser only.</div>'

      function applyTheme() { document.documentElement.setAttribute('data-theme', UI.ui.theme || 'dark'); var l = $('themeLbl'); if (l) l.textContent = (UI.ui.theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'); }

      /* ---- Events ---- */
      function isMobile() { return window.matchMedia('(max-width:820px)').matches; }
      function closeMobile() { $('sidebar').classList.remove('mobile-open'); $('scrim').classList.remove('show'); }
      function findItem(kind, id) {
        var r = UI.route, u = Registry.unit(r.sid, r.uid); if (!u) return null;
        var list = kind === 'a' ? u.sections.partA : u.sections.partBAnswers; return list.filter(function (q) { return q.id === id; })[0];
      }
      var Actions = {
        'open-sidebar': function () { if (isMobile()) { $('sidebar').classList.add('mobile-open'); $('scrim').classList.add('show'); } else { $('sidebar').classList.remove('collapsed'); UI.ui.collapsed = false; saveUI(); } },

        'import': function () { $('profileMenu').classList.remove('open'); Importer.open(); },

        'about': function () { $('profileMenu').classList.remove('open'); openAbout(); },

        'copy-code': function (b) { var ta = b.closest('.codeblock').querySelector('textarea'); copyText(ta.value, function () { toast('Code copied'); }); },
        'copy-answer': function (b) {
          var it = findItem(b.dataset.kind, b.dataset.id); if (!it) return;
          var t = it.sourceQuestion ? dcSourceQuestionText(it.sourceQuestion) : (b.dataset.kind === 'a' ? it.answer : it.sections.map(function (s) { return s.heading + '\n' + s.content; }).join('\n\n')); copyText(it.id + '. ' + it.question + '\n\n' + t, function () { toast('Answer copied'); });

          var raw = ImportantMarks.getUnit(b.dataset.subject, b.dataset.unit); if (!raw) return;

        'commit-import': function (b) { Importer.commit(b.dataset.mode); },

        'download-source-db': function () { var blob = new Blob([DC_SOURCE_TEXT], { type: 'application/json;charset=utf-8' }); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'CS3551_Distributed_Computing_MASTER_DATABASE.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000); },
        'export': function () {
          var blob = new Blob([JSON.stringify({ format: 'academic-study-hub-backup', appVersion: APP_VERSION, storageVersion: STORAGE_VERSION, exported: new Date().toISOString(), progress: Progress.data, library: Registry.packages, resources: UI.res }, null, 2)], { type: 'application/json' });
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'study-hub-backup.json'; document.body.appendChild(a); a.click(); a.remove();
        }
      };
      function bindEvents() {

          var img = t.closest && t.closest('img');
          if (img && !img.closest('.image-viewer')) { e.preventDefault(); Modal.open({ title: img.alt || 'Image preview', cls: 'image-viewer', html: '<img src="' + esc(img.currentSrc || img.src) + '" alt="' + esc(img.alt || 'Image preview') + '">' }); return; }
          var a = t.closest && t.closest('a[data-nav]');

          } else if (t.id === 'impFile' && t.files[0]) { Importer.onJson(t.files[0]); t.value = ''; }
          else if (t.id === 'importantJsonFiles' && t.files.length) { ImportantMarks.importFiles(t.files); t.value = ''; }
          else if (t.id === 'pdfFile' && t.files.length) { Importer.addPdfs(t.files); t.value = ''; }
        });
        document.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Modal.close(); SearchUI.open(); return; }
          if (e.key === 'Escape') { if (Modal.isOpen()) Modal.close(); else { closeMobile(); $('profileMenu').classList.remove('open'); } return; }
          if (Modal.isOpen() && e.target && e.target.id === 'sInput') SearchUI.key(e);
        });
        window.addEventListener('hashchange', function () { Router.render(); });
      }

      /* ---- Boot ---- */

      if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) boot();
    })(typeof window !== 'undefined' ? window : globalThis);
