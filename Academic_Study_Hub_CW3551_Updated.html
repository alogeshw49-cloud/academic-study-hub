<script type="application/json" id="seed-data">{"schemaVersion": "1.0.0", "application": {"name": "CW3551", "version": "1.0.0"}, "subjects": [{"subjectId": "CW3551", "subjectName": "Data and Information Security", "university": "Anna University", "regulation": "Regulation 2021", "semester": 5, "department": "Artificial Intelligence and Data Science", "units": [{"unitId": "UNIT01", "unitNumber": 1, "unitTitle": "Introduction to Data and Information Security", "notes": "CW3551 \u2013 Data and Information Security", "sections": {"partA": [{"id": "CW3551_UNIT01_Q01", "number": 1, "question": "State the basic components of information security.", "answer": "The basic components of information security are:\n\n1. Confidentiality: Ensures that information is accessed only by authorized users.\n\n2. Integrity: Ensures that information is accurate and not modified without authorization.\n\n3. Availability: Ensures that information and resources are available whenever required.\n\nThese three components are known as the CIA Triad."}, {"id": "CW3551_UNIT01_Q02", "number": 2, "question": "Classify the three components of the CIA triangle. What are they used for?", "answer": "The three components of the CIA triangle are:\n\n1. Confidentiality: Protects sensitive information from unauthorized access.\n\n2. Integrity: Protects information from unauthorized modification or destruction.\n\n3. Availability: Ensures reliable access to information and systems.\n\nUse: The CIA triad provides the foundation for designing and maintaining information security systems."}, {"id": "CW3551_UNIT01_Q03", "number": 3, "question": "Differentiate between vulnerability and exposure.", "answer": "| Vulnerability | Exposure |\n|---|---|\n| A weakness in a system that can be exploited by an attacker. | A condition that makes a system or information accessible to potential threats. |\n| Example: Weak password. | Example: Sensitive data accidentally exposed to the internet. |"}, {"id": "CW3551_UNIT01_Q04", "number": 4, "question": "Why is the top-down approach to information security superior to the bottom-up approach?", "answer": "The top-down approach is superior because:\n\n1. Security activities are initiated and supported by top-level management.\n\n2. It provides proper policies, planning, budget and resources.\n\n3. It ensures employee responsibility and organizational commitment.\n\n4. It provides better coordination and long-term security management."}, {"id": "CW3551_UNIT01_Q05", "number": 5, "question": "Give the phases of the Security System Development Life Cycle.", "answer": "The six phases of the Security System Development Life Cycle (SecSDLC) are:\n\n1. Investigation: Identify security requirements and problems.\n\n2. Analysis: Examine existing systems and identify security weaknesses.\n\n3. Logical Design: Develop security policies and proposed solutions.\n\n4. Physical Design: Select suitable technologies and security mechanisms.\n\n5. Implementation: Install and configure the security solutions.\n\n6. Maintenance: Monitor, update and improve the security system."}, {"id": "CW3551_UNIT01_Q06", "number": 6, "question": "Describe the critical characteristics of information. What are their uses?", "answer": "The critical characteristics of information are:\n\n1. Availability: Information is accessible when needed.\n\n2. Accuracy: Information is correct and free from errors.\n\n3. Authenticity: Information is genuine and trustworthy.\n\n4. Confidentiality: Information is protected from unauthorized access.\n\n5. Integrity: Information remains complete and unaltered.\n\n6. Utility: Information is useful and available in a meaningful format.\n\n7. Possession: Ensures authorized ownership and control of information.\n\nUse: These characteristics help organizations protect information and maintain its security, reliability and usefulness."}, {"id": "CW3551_UNIT01_Q07", "number": 7, "question": "What is the NSTISSC security model?", "answer": "The NSTISSC (National Security Telecommunications and Information Systems Security Committee) security model is a framework used to understand and implement information security.\n\nIt consists of three dimensions:\n\n1. Security objectives \u2013 Confidentiality, Integrity and Availability.\n\n2. Information states \u2013 Storage, Processing and Transmission.\n\n3. Security measures \u2013 Policies, Education and Technology.\n\nIt is also known as the McCumber Cube and helps organizations develop comprehensive security solutions."}, {"id": "CW3551_UNIT01_Q08", "number": 8, "question": "What is the top-down approach?", "answer": "The top-down approach is a security management method in which security planning and decisions are initiated by top-level management and communicated to lower-level employees.\n\nIt ensures proper policies, resources, responsibilities and organizational support for information security."}, {"id": "CW3551_UNIT01_Q09", "number": 9, "question": "What is the bottom-up approach?", "answer": "The bottom-up approach is a security management method in which security solutions are developed by technical employees or lower-level staff without initial direction from top-level management.\n\nIt focuses mainly on technical solutions rather than organizational security policies."}, {"id": "CW3551_UNIT01_Q10", "number": 10, "question": "Differentiate between top-down and bottom-up approaches.", "answer": "| Top-down approach | Bottom-up approach |\n|---|---|\n| Initiated by top-level management. | Initiated by technical employees. |\n| Follows management direction. | Follows technical requirements. |\n| Provides organizational support and resources. | May lack management support. |\n| Focuses on policies and overall security. | Focuses mainly on technical solutions. |"}, {"id": "CW3551_UNIT01_Q11", "number": 11, "question": "Define Security System Development Life Cycle (SecSDLC).", "answer": "The Security System Development Life Cycle (SecSDLC) is a systematic process used to develop, implement and maintain an organization's information security system.\n\nIt consists of six phases: Investigation, Analysis, Logical Design, Physical Design, Implementation and Maintenance."}, {"id": "CW3551_UNIT01_Q12", "number": 12, "question": "How is Email Spoofing different from Phishing?", "answer": "| Email Spoofing | Phishing |\n|---|---|\n| It is an attack in which the sender's email address is forged. | It is an attack that tricks users into revealing sensitive information. |\n| It makes an email appear to come from a trusted sender. | It uses fake emails or websites to steal information. |\n| Example: An email with a forged bank address. | Example: A fake bank email asking for login credentials. |"}, {"id": "CW3551_UNIT01_Q13", "number": 13, "question": "What are the multiple layers of security?", "answer": "Multiple layers of security refer to the use of different security mechanisms to protect an organization's information and systems.\n\nThe major layers are:\n\n1. Physical Security: Protects buildings and hardware.\n\n2. Network Security: Protects network communication.\n\n3. Host Security: Protects individual computers and servers.\n\n4. Application Security: Protects software applications.\n\n5. Data Security: Protects stored and transmitted information.\n\nThis approach is called Defense in Depth."}, {"id": "CW3551_UNIT01_Q14", "number": 14, "question": "Differentiate between Direct and Indirect Attacks.", "answer": "| Direct Attack | Indirect Attack |\n|---|---|\n| The attacker directly targets the victim or system. | The attacker uses an intermediary or compromised system. |\n| The attack originates from the attacker's own system. | The attack is carried out through another system. |\n| Example: Directly attacking a server. | Example: Using a compromised computer to attack a server. |"}, {"id": "CW3551_UNIT01_Q15", "number": 15, "question": "What is RAND Report R-609?", "answer": "The RAND Report R-609, titled Security Controls for Computer Systems, is an influential report published in 1970 by the RAND Corporation.\n\nIt discussed computer security requirements, security controls and methods for protecting computer systems from unauthorized access.\n\nIt helped establish important foundations for modern computer security research."}], "partBSynopsis": [], "partBAnswers": []}}, {"unitId": "UNIT02", "unitNumber": 2, "unitTitle": "Security Investigation", "notes": "CW3551 \u2013 Data and Information Security", "sections": {"partA": [{"id": "CW3551_UNIT02_Q01", "number": 1, "question": "What is the difference between Denial of Service (DoS) attack and Distributed Denial of Service (DDoS) attack?", "answer": "| DoS Attack | DDoS Attack |\n|---|---|\n| An attack launched from a single system. | An attack launched from multiple compromised systems. |\n| Targets a server to make its services unavailable. | Floods the target with traffic from multiple sources. |\n| Easier to identify and block. | Difficult to identify and block. |\n\nExample: A single computer flooding a website is a DoS attack, whereas thousands of infected computers flooding a website is a DDoS attack."}, {"id": "CW3551_UNIT02_Q02", "number": 2, "question": "How is Due Diligence different from Due Care? What is their importance?", "answer": "- Due Care: Refers to taking reasonable steps to protect an organization's information and systems.\n\n- Due Diligence: Refers to continuously investigating, monitoring and evaluating security measures to ensure they are effective.\n\nImportance: Both help organizations reduce security risks, prevent attacks and fulfil their security responsibilities."}, {"id": "CW3551_UNIT02_Q03", "number": 3, "question": "What are the professional issues in security investigation?", "answer": "Professional issues in security investigation include:\n\n1. Maintaining professional standards and responsibilities.\n\n2. Protecting confidential information.\n\n3. Following organizational security policies.\n\n4. Reporting security incidents accurately.\n\n5. Avoiding misuse of professional knowledge."}, {"id": "CW3551_UNIT02_Q04", "number": 4, "question": "What are the ethical issues in security investigation?", "answer": "Ethical issues in security investigation include:\n\n1. Respecting individual privacy.\n\n2. Obtaining proper authorization before accessing data.\n\n3. Maintaining confidentiality.\n\n4. Avoiding unauthorized disclosure of information.\n\n5. Using security knowledge responsibly."}, {"id": "CW3551_UNIT02_Q05", "number": 5, "question": "What are Confidentiality, Integrity and Hybrid policies? Give relevant examples.", "answer": "1. Confidentiality Policy: Ensures that information is accessed only by authorized users.\n\nExample: Only authorized employees can access salary records.\n\n2. Integrity Policy: Ensures that information is accurate and protected from unauthorized modification.\n\nExample: Only authorized staff can modify student marks.\n\n3. Hybrid Policy: Combines confidentiality and integrity policies to protect information from unauthorized access and modification.\n\nExample: A banking system allows only authorized employees to view and update customer records."}, {"id": "CW3551_UNIT02_Q06", "number": 6, "question": "What are the types of security policies?", "answer": "The major types of security policies are:\n\n1. Enterprise Information Security Policy (EISP): Defines the overall information security direction and responsibilities of an organization.\n\n2. Issue-Specific Security Policy (ISSP): Provides rules for specific security issues such as email and internet usage.\n\n3. System-Specific Security Policy (SysSP): Defines security rules and configurations for individual systems."}, {"id": "CW3551_UNIT02_Q07", "number": 7, "question": "Why is security required in computer systems?", "answer": "Security is required in computer systems to:\n\n1. Prevent unauthorized access to information.\n\n2. Protect data from theft and modification.\n\n3. Prevent malware and cyberattacks.\n\n4. Maintain confidentiality, integrity and availability.\n\n5. Ensure safe and reliable system operation."}, {"id": "CW3551_UNIT02_Q08", "number": 8, "question": "Give one example of an ethical issue in computer security.", "answer": "Accessing another person's private files without permission is an ethical issue in computer security because it violates privacy and confidentiality."}, {"id": "CW3551_UNIT02_Q09", "number": 9, "question": "Mention any two standard algorithms used in DSS.", "answer": "The two standard algorithms used in the Digital Signature Standard (DSS) are:\n\n1. DSA (Digital Signature Algorithm): Used to generate and verify digital signatures.\n\n2. SHA (Secure Hash Algorithm): Used to generate a message digest for digital signature operations."}, {"id": "CW3551_UNIT02_Q10", "number": 10, "question": "What is Malware?", "answer": "Malware is malicious software designed to damage, disrupt, steal information from or gain unauthorized access to a computer system.\n\nExamples include viruses, worms, Trojans, ransomware and spyware."}, {"id": "CW3551_UNIT02_Q11", "number": 11, "question": "Differentiate between Threat and Attack.", "answer": "| Threat | Attack |\n|---|---|\n| A potential danger that may exploit a system weakness. | An actual attempt to exploit a system weakness. |\n| It represents a possible security risk. | It represents an action against a system. |\n| Example: Possibility of malware infection. | Example: Installing malware on a computer. |"}, {"id": "CW3551_UNIT02_Q12", "number": 12, "question": "What is Information Extortion?", "answer": "Information extortion is a cybercrime in which an attacker threatens to reveal, destroy or misuse confidential information unless a ransom or payment is made.\n\nExample: An attacker steals company data and demands money to prevent its public release."}, {"id": "CW3551_UNIT02_Q13", "number": 13, "question": "List four important functions of an organization based on information security.", "answer": "1. Prevention: Prevents security attacks.\n\n2. Detection: Identifies security incidents.\n\n3. Response: Takes action against security incidents.\n\n4. Recovery: Restores normal system operations."}, {"id": "CW3551_UNIT02_Q14", "number": 14, "question": "Differentiate between Worms and Viruses.", "answer": "| Worm | Virus |\n|---|---|\n| A worm is a standalone malicious program. | A virus attaches itself to a host file or program. |\n| It spreads automatically through networks. | It spreads when the infected file or program is executed. |\n| It does not require a host file. | It requires a host file or program. |"}, {"id": "CW3551_UNIT02_Q15", "number": 15, "question": "What is a Trojan Horse?", "answer": "A Trojan Horse is a type of malware that disguises itself as legitimate or useful software to trick users into installing or executing it.\n\nIt can steal information, damage files or provide unauthorized access to attackers."}, {"id": "CW3551_UNIT02_Q16", "number": 16, "question": "List any five attacks used against control systems.", "answer": "Five attacks against industrial control systems (ICS) are:\n\n1. Denial of Service (DoS) attack.\n\n2. Man-in-the-Middle attack.\n\n3. Malware attack.\n\n4. Replay attack.\n\n5. Spoofing attack."}, {"id": "CW3551_UNIT02_Q17", "number": 17, "question": "What is Intellectual Property?", "answer": "Intellectual Property (IP) refers to creations of the human mind, such as inventions, designs, software, literary works and trademarks.\n\nIt is legally protected through copyrights, patents and trademarks."}, {"id": "CW3551_UNIT02_Q18", "number": 18, "question": "Differentiate between Insider Attack and Outsider Attack.", "answer": "| Insider Attack | Outsider Attack |\n|---|---|\n| Launched by a person within an organization. | Launched by a person outside an organization. |\n| The attacker may have authorized access. | The attacker generally has no authorized access. |\n| Example: An employee stealing company data. | Example: A hacker attacking a company network. |"}, {"id": "CW3551_UNIT02_Q19", "number": 19, "question": "Define Active Attacks and its types.", "answer": "An Active Attack is a security attack in which an attacker modifies, deletes, inserts or disrupts data or system operations.\n\nThe main types are:\n\n1. Masquerade: Attacker pretends to be an authorized user.\n\n2. Replay: Attacker captures and retransmits data.\n\n3. Message Modification: Attacker changes transmitted information.\n\n4. Denial of Service: Attacker prevents legitimate users from accessing services."}], "partBSynopsis": [], "partBAnswers": []}}, {"unitId": "UNIT03", "unitNumber": 3, "unitTitle": "Digital Signature and Authentications", "notes": "CW3551 \u2013 Data and Information Security", "sections": {"partA": [{"id": "CW3551_UNIT03_Q01", "number": 1, "question": "What is the difference between Entity Authentication and Message Authentication?", "answer": "| Entity Authentication | Message Authentication |\n|---|---|\n| Verifies the identity of a communicating entity. | Verifies the authenticity and integrity of a message. |\n| Confirms who is communicating. | Confirms that the message is genuine and unchanged. |\n| Example: Password-based login. | Example: Message Authentication Code (MAC). |"}, {"id": "CW3551_UNIT03_Q02", "number": 2, "question": "Mention any two standard algorithms used in DSS.", "answer": "The two standard algorithms used in the Digital Signature Standard (DSS) are:\n\n1. DSA (Digital Signature Algorithm): Used to generate and verify digital signatures.\n\n2. SHA (Secure Hash Algorithm): Used to generate a message digest for digital signature operations."}, {"id": "CW3551_UNIT03_Q03", "number": 3, "question": "Compare Digital Signatures and Digital Certificates.", "answer": "| Digital Signature | Digital Certificate |\n|---|---|\n| Used to verify the authenticity and integrity of a message. | Used to verify the identity of a person or organization. |\n| Created using the sender's private key. | Issued and digitally signed by a Certificate Authority (CA). |\n| Provides authentication, integrity and non-repudiation. | Establishes trust between a public key and its owner. |"}, {"id": "CW3551_UNIT03_Q04", "number": 4, "question": "List the security services provided by Digital Signature.", "answer": "The security services provided by a digital signature are:\n\n1. Authentication: Verifies the identity of the sender.\n\n2. Integrity: Ensures that the message has not been modified.\n\n3. Non-repudiation: Prevents the sender from denying the signed message."}, {"id": "CW3551_UNIT03_Q05", "number": 5, "question": "Write the two algorithms for the DSS scheme.", "answer": "The two main algorithms used in the Digital Signature Standard (DSS) are:\n\n1. DSA (Digital Signature Algorithm): Generates and verifies digital signatures.\n\n2. SHA (Secure Hash Algorithm): Produces a message digest used during digital signature generation and verification."}, {"id": "CW3551_UNIT03_Q06", "number": 6, "question": "Distinguish between Origin Authentication and Entity Authentication.", "answer": "| Origin Authentication | Entity Authentication |\n|---|---|\n| Verifies the source or origin of a message. | Verifies the identity of a communicating entity. |\n| Confirms who sent the message. | Confirms who is participating in communication. |\n| Example: Verifying the sender of an email. | Example: User login authentication. |"}, {"id": "CW3551_UNIT03_Q07", "number": 7, "question": "What is Kerberos Authentication Protocol?", "answer": "Kerberos is a network authentication protocol that uses secret-key cryptography and tickets to authenticate users and services securely over an insecure network.\n\nIt uses a trusted third party called the Key Distribution Center (KDC) to provide authentication."}, {"id": "CW3551_UNIT03_Q08", "number": 8, "question": "What is an X.509 Certificate?", "answer": "X.509 is an international standard that defines the format of digital certificates used in Public Key Infrastructure (PKI).\n\nIt contains information such as:\n\n1. Certificate owner's name.\n\n2. Public key.\n\n3. Issuer's name.\n\n4. Validity period.\n\n5. Certificate Authority's digital signature.\n\nIt is used to verify the identity of users and organizations."}, {"id": "CW3551_UNIT03_Q09", "number": 9, "question": "Compare RSA Algorithm and DSA Algorithm.", "answer": "| RSA Algorithm | DSA Algorithm |\n|---|---|\n| RSA stands for Rivest\u2013Shamir\u2013Adleman. | DSA stands for Digital Signature Algorithm. |\n| Used for encryption, decryption and digital signatures. | Primarily used for digital signatures. |\n| Security is based on integer factorization. | Security is based on the discrete logarithm problem. |\n| Can provide encryption and digital signatures. | Provides digital signature generation and verification. |"}, {"id": "CW3551_UNIT03_Q10", "number": 10, "question": "What are the properties of Digital Signatures?", "answer": "1. Authentication: Verifies the identity of the sender.\n\n2. Integrity: Ensures that the message is not modified.\n\n3. Non-repudiation: Prevents the sender from denying the signature.\n\n4. Unforgeability: Prevents unauthorized users from creating a valid signature."}, {"id": "CW3551_UNIT03_Q11", "number": 11, "question": "What are the characteristics of a certificate generated by a Certificate Authority (CA)?", "answer": "A digital certificate issued by a Certificate Authority has the following characteristics:\n\n1. Identity: Identifies the certificate owner.\n\n2. Public Key: Contains the owner's public key.\n\n3. Issuer: Identifies the Certificate Authority.\n\n4. Validity: Specifies the certificate's validity period.\n\n5. Digital Signature: Contains the CA's digital signature.\n\nIt establishes security, public trust and reliability in digital communication."}, {"id": "CW3551_UNIT03_Q12", "number": 12, "question": "List the requirements of Kerberos.", "answer": "The important requirements of Kerberos are:\n\n1. Secure: Prevents unauthorized access.\n\n2. Reliable: Provides dependable authentication.\n\n3. Transparent: Authentication should be simple for users.\n\n4. Scalable: Supports a large number of users and services."}, {"id": "CW3551_UNIT03_Q13", "number": 13, "question": "What is a Primitive Root?", "answer": "A Primitive Root is an integer whose powers generate all the non-zero integers modulo a prime number.\n\nFor a prime number p, an integer g is a primitive root if its powers modulo p produce all non-zero residues from 1 to p\u22121.\n\nExample: 3 is a primitive root modulo 7 because its powers generate 1, 2, 3, 4, 5 and 6 modulo 7."}], "partBSynopsis": [], "partBAnswers": []}}, {"unitId": "UNIT04", "unitNumber": 4, "unitTitle": "Email and IP Security", "notes": "CW3551 \u2013 Data and Information Security", "sections": {"partA": [{"id": "CW3551_UNIT04_Q01", "number": 1, "question": "State the significance of Message Transfer Agent (MTA).", "answer": "A Message Transfer Agent (MTA) is software responsible for transferring email messages from one mail server to another using the SMTP protocol.\n\nSignificance:\n\n1. Transfers emails between mail servers.\n\n2. Routes messages to the correct destination.\n\n3. Stores and forwards messages when required."}, {"id": "CW3551_UNIT04_Q02", "number": 2, "question": "What are the services provided by PGP?", "answer": "PGP (Pretty Good Privacy) provides the following security services:\n\n1. Authentication: Verifies the sender using a digital signature.\n\n2. Confidentiality: Encrypts messages using symmetric encryption.\n\n3. Compression: Compresses messages before encryption.\n\n4. Email Compatibility: Converts encrypted data into ASCII format using Radix-64 encoding.\n\n5. Segmentation: Divides large messages into smaller parts for transmission."}, {"id": "CW3551_UNIT04_Q03", "number": 3, "question": "Describe the Encapsulating Security Payload (ESP).", "answer": "Encapsulating Security Payload (ESP) is a protocol of IPsec that provides security to IP packets through encryption and optional authentication.\n\nIts main services are:\n\n1. Confidentiality through encryption.\n\n2. Data origin authentication.\n\n3. Connectionless integrity.\n\n4. Anti-replay protection.\n\nESP protects data during transmission over an IP network."}, {"id": "CW3551_UNIT04_Q04", "number": 4, "question": "Explain the architecture of Secure Electronic Payment.", "answer": "Secure Electronic Transaction (SET) is a protocol designed to provide secure credit card transactions over the internet.\n\nIts main components are:\n\n1. Cardholder: Person who purchases goods or services.\n\n2. Merchant: Seller who provides goods or services.\n\n3. Issuer: Bank that issues the payment card.\n\n4. Acquirer: Merchant's bank that processes payments.\n\n5. Payment Gateway: Processes and authorizes electronic payments.\n\n6. Certificate Authority (CA): Issues digital certificates to verify identities."}, {"id": "CW3551_UNIT04_Q05", "number": 5, "question": "Why do we need a key ring in data communication?", "answer": "A key ring is a collection of cryptographic keys maintained by a user in PGP.\n\nIt is needed to:\n\n1. Store public keys of other users.\n\n2. Store the user's own private and public keys.\n\n3. Manage and retrieve keys easily.\n\n4. Support encryption, decryption and digital signature operations."}, {"id": "CW3551_UNIT04_Q06", "number": 6, "question": "Write a note on Email Architecture.", "answer": "Email architecture is the structure used to send, receive and manage electronic messages over a network.\n\nIts main components are:\n\n1. User Agent (UA): Allows users to compose, send and read emails.\n\n2. Message Transfer Agent (MTA): Transfers emails between mail servers using SMTP.\n\n3. Message Access Agent (MAA): Allows users to retrieve emails using POP3 or IMAP.\n\n4. Mail Server: Stores and manages email messages."}, {"id": "CW3551_UNIT04_Q07", "number": 7, "question": "What is the purpose of the Padding Field in ESP?", "answer": "The Padding Field in Encapsulating Security Payload (ESP) is used to:\n\n1. Align data according to encryption algorithm requirements.\n\n2. Ensure that the encrypted data has the required block size.\n\n3. Hide the actual length of the payload to some extent."}, {"id": "CW3551_UNIT04_Q08", "number": 8, "question": "Describe Replay Attack.", "answer": "A Replay Attack is a security attack in which an attacker captures a valid transmitted message and retransmits it later to gain unauthorized access or perform fraudulent operations.\n\nExample: An attacker captures a valid banking transaction request and retransmits it to repeat the transaction.\n\nPrevention: Sequence numbers, timestamps and anti-replay mechanisms are used to prevent replay attacks."}, {"id": "CW3551_UNIT04_Q09", "number": 9, "question": "What is POP3?", "answer": "POP3 (Post Office Protocol Version 3) is an email protocol used by a client to retrieve emails from a mail server.\n\nIts main functions are:\n\n1. Downloads emails from the mail server.\n\n2. Allows users to read received messages.\n\n3. Can remove downloaded messages from the server."}, {"id": "CW3551_UNIT04_Q10", "number": 10, "question": "What is PGP?", "answer": "PGP (Pretty Good Privacy) is an email security system used to provide confidentiality and authentication through encryption and digital signatures.\n\nIt provides authentication, confidentiality, compression, email compatibility and message segmentation."}, {"id": "CW3551_UNIT04_Q11", "number": 11, "question": "What is MIME?", "answer": "MIME (Multipurpose Internet Mail Extensions) is an internet standard that extends the email format to support different types of data.\n\nIt allows emails to contain:\n\n1. Images.\n\n2. Audio and video files.\n\n3. Documents and attachments.\n\n4. Non-ASCII text."}, {"id": "CW3551_UNIT04_Q12", "number": 12, "question": "What is S/MIME?", "answer": "S/MIME (Secure/Multipurpose Internet Mail Extensions) is a standard used to provide security for electronic mail messages.\n\nIt provides:\n\n1. Authentication: Verifies the sender.\n\n2. Confidentiality: Encrypts email messages.\n\n3. Integrity: Protects messages from modification.\n\n4. Non-repudiation: Provides evidence of the sender's digital signature."}], "partBSynopsis": [], "partBAnswers": []}}, {"unitId": "UNIT05", "unitNumber": 5, "unitTitle": "Web Security", "notes": "CW3551 \u2013 Data and Information Security", "sections": {"partA": [{"id": "CW3551_UNIT05_Q01", "number": 1, "question": "What is Digital Signature Verification in SET?", "answer": "In Secure Electronic Transaction (SET), digital signature verification is the process of checking the authenticity and integrity of an electronic payment message using the sender's public key.\n\nIt ensures that the message was sent by the authorized person and has not been modified."}, {"id": "CW3551_UNIT05_Q02", "number": 2, "question": "List the parameters of Session State in TLS.", "answer": "The parameters of TLS Session State are:\n\n1. Session Identifier: Identifies the session.\n\n2. Peer Certificate: Contains the peer's digital certificate.\n\n3. Compression Method: Specifies the compression algorithm.\n\n4. Cipher Spec: Defines the encryption and hashing algorithms.\n\n5. Master Secret: A secret value shared between the client and server.\n\n6. Is Resumable: Indicates whether the session can be reused."}, {"id": "CW3551_UNIT05_Q03", "number": 3, "question": "Explain the Architecture of SSL.", "answer": "SSL (Secure Sockets Layer) is a security protocol that provides secure communication between a client and a server over a network.\n\nThe SSL architecture consists of four main protocols:\n\n1. SSL Record Protocol: Provides encryption and message integrity.\n\n2. Handshake Protocol: Establishes security parameters and authenticates the parties.\n\n3. Change Cipher Spec Protocol: Activates the negotiated security settings.\n\n4. Alert Protocol: Sends warning and error messages between communicating parties."}, {"id": "CW3551_UNIT05_Q04", "number": 4, "question": "Explain the concept of Digital Signature Verification.", "answer": "Digital signature verification is the process of checking whether a digital signature is valid using the sender's public key.\n\nSteps:\n\n1. The receiver obtains the signed message and digital signature.\n\n2. The receiver uses the sender's public key to verify the signature.\n\n3. The receiver calculates the message digest.\n\n4. Both digest values are compared.\n\n5. If they match, the signature is valid."}, {"id": "CW3551_UNIT05_Q05", "number": 5, "question": "Differentiate between Session and Connection in TLS.", "answer": "| Session | Connection |\n|---|---|\n| A session is an association between a client and server. | A connection is a temporary communication channel between them. |\n| It defines shared security parameters. | It uses the security parameters of a session. |\n| Multiple connections can belong to one session. | Each connection is associated with one session. |\n| It can be reused for multiple connections. | It is terminated when communication ends. |"}, {"id": "CW3551_UNIT05_Q06", "number": 6, "question": "Write a note on Digital Signature Verification in Secure Electronic Transaction (SET).", "answer": "In SET, digital signature verification ensures the authenticity and integrity of electronic payment transactions.\n\n1. The receiver obtains the sender's digital signature.\n\n2. The sender's public key is used to verify the signature.\n\n3. The message digest is calculated and compared.\n\n4. If both digest values match, the signature is valid.\n\nIt prevents unauthorized modification and provides authentication and non-repudiation."}, {"id": "CW3551_UNIT05_Q07", "number": 7, "question": "What is Handshake Protocol?", "answer": "The TLS Handshake Protocol is used to establish a secure connection between a client and a server.\n\nIts functions are:\n\n1. Negotiates security algorithms.\n\n2. Authenticates the client and server.\n\n3. Establishes shared secret keys.\n\n4. Creates secure communication parameters."}, {"id": "CW3551_UNIT05_Q08", "number": 8, "question": "What is Record Protocol?", "answer": "The TLS Record Protocol provides secure transmission of application data between a client and a server.\n\nIts main functions are:\n\n1. Fragmentation of data.\n\n2. Optional compression.\n\n3. Encryption of data.\n\n4. Message integrity protection."}, {"id": "CW3551_UNIT05_Q09", "number": 9, "question": "What is Alert Protocol?", "answer": "The TLS Alert Protocol is used to communicate warning and error messages between a client and a server.\n\nIt provides two types of alerts:\n\n1. Warning Alert: Indicates a non-critical problem.\n\n2. Fatal Alert: Indicates a serious error and terminates the connection."}, {"id": "CW3551_UNIT05_Q10", "number": 10, "question": "What is SSL?", "answer": "SSL (Secure Sockets Layer) is a security protocol developed by Netscape to provide encrypted communication between a client and a server over the internet.\n\nIt provides confidentiality, authentication and data integrity.\n\nNote: SSL is obsolete and has been replaced by TLS."}, {"id": "CW3551_UNIT05_Q11", "number": 11, "question": "What is SET?", "answer": "SET (Secure Electronic Transaction) is a security protocol developed by Visa and Mastercard to secure credit card transactions over the internet.\n\nIt provides:\n\n1. Confidentiality.\n\n2. Authentication.\n\n3. Data integrity.\n\n4. Secure electronic payment processing."}, {"id": "CW3551_UNIT05_Q12", "number": 12, "question": "What are the types of SSL Certificates?", "answer": "The major types of SSL certificates are:\n\n1. Domain Validated (DV): Verifies domain ownership.\n\n2. Organization Validated (OV): Verifies domain ownership and organization details.\n\n3. Extended Validation (EV): Provides extensive verification of the organization's identity.\n\nThese certificates help establish secure communication between websites and users."}, {"id": "CW3551_UNIT05_Q13", "number": 13, "question": "Differentiate between TLS 1.2 and TLS 1.3.", "answer": "| TLS 1.2 | TLS 1.3 |\n|---|---|\n| Older version of TLS. | Newer version of TLS. |\n| Handshake generally requires two round trips. | Handshake generally requires one round trip. |\n| Supports older cryptographic algorithms and cipher suites. | Supports modern and stronger cryptographic algorithms. |\n| Supports RSA key exchange. | Removes static RSA key exchange. |\n| Comparatively slower handshake. | Faster and more secure handshake. |"}, {"id": "CW3551_UNIT05_Q14", "number": 14, "question": "What is the difference between Passive and Active Attacks in Web Security?", "answer": "| Passive Attack | Active Attack |\n|---|---|\n| Monitors or observes communication without modifying data. | Modifies, deletes or disrupts communication. |\n| Mainly targets confidentiality. | Mainly targets integrity and availability. |\n| Difficult to detect. | Usually easier to detect. |\n| Example: Eavesdropping and traffic analysis. | Example: Website defacement and DoS attacks. |"}, {"id": "CW3551_UNIT05_Q15", "number": 15, "question": "Explain Change Cipher Spec Protocol.", "answer": "The Change Cipher Spec Protocol is a protocol in SSL/TLS used to inform the other party that the negotiated security parameters and cipher specifications will now be activated.\n\nIts functions are:\n\n1. Activates the negotiated encryption algorithm.\n\n2. Activates the selected authentication and integrity mechanisms.\n\n3. Indicates that subsequent records will use the new security settings."}, {"id": "CW3551_UNIT05_Q16", "number": 16, "question": "Define TLS.", "answer": "TLS (Transport Layer Security) is a cryptographic protocol used to provide secure communication between clients and servers over a network.\n\nIt provides three main security services:\n\n1. Confidentiality: Protects data through encryption.\n\n2. Integrity: Protects data from unauthorized modification.\n\n3. Authentication: Verifies the communicating parties.\n\nTLS is the successor to SSL."}], "partBSynopsis": [], "partBAnswers": []}}]}]}</script>
<script type="application/json" data-important-package="CW3551_Important_2_Marks_Units_I_to_V.json">{"schemaVersion":"1.0","feature":"important_2_marks_bundle","subject":{"subjectCode":"CW3551","subjectName":"Data and Information Security","department":"Artificial Intelligence and Data Science","university":"Anna University","regulation":"Regulation 2021"},"units":[{"unit":{"unitId":"UNIT01","unitNumber":1,"unitTitle":"Introduction to Data and Information Security"},"importantTwoMarks":[{"question":"State the basic components of information security.","answer":"The basic components of information security are:\n\n1. Confidentiality: Ensures that information is accessed only by authorized users.\n\n2. Integrity: Ensures that information is accurate and not modified without authorization.\n\n3. Availability: Ensures that information and resources are available whenever required.\n\nThese three components are known as the CIA Triad.","sourcePage":1,"questionId":"CW3551_UNIT01_Q01","questionNumber":1,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Classify the three components of the CIA triangle. What are they used for?","answer":"The three components of the CIA triangle are:\n\n1. Confidentiality: Protects sensitive information from unauthorized access.\n\n2. Integrity: Protects information from unauthorized modification or destruction.\n\n3. Availability: Ensures reliable access to information and systems.\n\nUse: The CIA triad provides the foundation for designing and maintaining information security systems.","sourcePage":1,"questionId":"CW3551_UNIT01_Q02","questionNumber":2,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Differentiate between vulnerability and exposure.","answer":"| Vulnerability | Exposure |\n|---|---|\n| A weakness in a system that can be exploited by an attacker. | A condition that makes a system or information accessible to potential threats. |\n| Example: Weak password. | Example: Sensitive data accidentally exposed to the internet. |","sourcePage":1,"questionId":"CW3551_UNIT01_Q03","questionNumber":3,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Why is the top-down approach to information security superior to the bottom-up approach?","answer":"The top-down approach is superior because:\n\n1. Security activities are initiated and supported by top-level management.\n\n2. It provides proper policies, planning, budget and resources.\n\n3. It ensures employee responsibility and organizational commitment.\n\n4. It provides better coordination and long-term security management.","sourcePage":1,"questionId":"CW3551_UNIT01_Q04","questionNumber":4,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Give the phases of the Security System Development Life Cycle.","answer":"The six phases of the Security System Development Life Cycle (SecSDLC) are:\n\n1. Investigation: Identify security requirements and problems.\n\n2. Analysis: Examine existing systems and identify security weaknesses.\n\n3. Logical Design: Develop security policies and proposed solutions.\n\n4. Physical Design: Select suitable technologies and security mechanisms.\n\n5. Implementation: Install and configure the security solutions.\n\n6. Maintenance: Monitor, update and improve the security system.","sourcePage":1,"questionId":"CW3551_UNIT01_Q05","questionNumber":5,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Describe the critical characteristics of information. What are their uses?","answer":"The critical characteristics of information are:\n\n1. Availability: Information is accessible when needed.\n\n2. Accuracy: Information is correct and free from errors.\n\n3. Authenticity: Information is genuine and trustworthy.\n\n4. Confidentiality: Information is protected from unauthorized access.\n\n5. Integrity: Information remains complete and unaltered.\n\n6. Utility: Information is useful and available in a meaningful format.\n\n7. Possession: Ensures authorized ownership and control of information.\n\nUse: These characteristics help organizations protect information and maintain its security, reliability and usefulness.","sourcePage":2,"questionId":"CW3551_UNIT01_Q06","questionNumber":6,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"What is the NSTISSC security model?","answer":"The NSTISSC (National Security Telecommunications and Information Systems Security Committee) security model is a framework used to understand and implement information security.\n\nIt consists of three dimensions:\n\n1. Security objectives – Confidentiality, Integrity and Availability.\n\n2. Information states – Storage, Processing and Transmission.\n\n3. Security measures – Policies, Education and Technology.\n\nIt is also known as the McCumber Cube and helps organizations develop comprehensive security solutions.","sourcePage":2,"questionId":"CW3551_UNIT01_Q07","questionNumber":7,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"What is the top-down approach?","answer":"The top-down approach is a security management method in which security planning and decisions are initiated by top-level management and communicated to lower-level employees.\n\nIt ensures proper policies, resources, responsibilities and organizational support for information security.","sourcePage":2,"questionId":"CW3551_UNIT01_Q08","questionNumber":8,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"What is the bottom-up approach?","answer":"The bottom-up approach is a security management method in which security solutions are developed by technical employees or lower-level staff without initial direction from top-level management.\n\nIt focuses mainly on technical solutions rather than organizational security policies.","sourcePage":2,"questionId":"CW3551_UNIT01_Q09","questionNumber":9,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Differentiate between top-down and bottom-up approaches.","answer":"| Top-down approach | Bottom-up approach |\n|---|---|\n| Initiated by top-level management. | Initiated by technical employees. |\n| Follows management direction. | Follows technical requirements. |\n| Provides organizational support and resources. | May lack management support. |\n| Focuses on policies and overall security. | Focuses mainly on technical solutions. |","sourcePage":2,"questionId":"CW3551_UNIT01_Q10","questionNumber":10,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"Define Security System Development Life Cycle (SecSDLC).","answer":"The Security System Development Life Cycle (SecSDLC) is a systematic process used to develop, implement and maintain an organization's information security system.\n\nIt consists of six phases: Investigation, Analysis, Logical Design, Physical Design, Implementation and Maintenance.","sourcePage":2,"questionId":"CW3551_UNIT01_Q11","questionNumber":11,"sourceFile":"CW3551_Unit_I_Two_Mark_Answers.pdf"},{"question":"How is Email Spoofing different from Phishing?","answer":"| Email Spoofing | Phishing |\n|---|---|\n| It is an attack in which the sender's email address is forged. | It is an attack that tricks users into revealing sensitive information. |\n| It makes an email appear to come from a trusted sender. | It uses fake emails or websites to steal information. |\n| Example: An email with a forged bank address. | Example: A fake bank email asking for login credentials. |","sourcePage":1,"questionId":"CW3551_UNIT01_Q12","questionNumber":12,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What are the multiple layers of security?","answer":"Multiple layers of security refer to the use of different security mechanisms to protect an organization's information and systems.\n\nThe major layers are:\n\n1. Physical Security: Protects buildings and hardware.\n\n2. Network Security: Protects network communication.\n\n3. Host Security: Protects individual computers and servers.\n\n4. Application Security: Protects software applications.\n\n5. Data Security: Protects stored and transmitted information.\n\nThis approach is called Defense in Depth.","sourcePage":1,"questionId":"CW3551_UNIT01_Q13","questionNumber":13,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Differentiate between Direct and Indirect Attacks.","answer":"| Direct Attack | Indirect Attack |\n|---|---|\n| The attacker directly targets the victim or system. | The attacker uses an intermediary or compromised system. |\n| The attack originates from the attacker's own system. | The attack is carried out through another system. |\n| Example: Directly attacking a server. | Example: Using a compromised computer to attack a server. |","sourcePage":1,"questionId":"CW3551_UNIT01_Q14","questionNumber":14,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is RAND Report R-609?","answer":"The RAND Report R-609, titled Security Controls for Computer Systems, is an influential report published in 1970 by the RAND Corporation.\n\nIt discussed computer security requirements, security controls and methods for protecting computer systems from unauthorized access.\n\nIt helped establish important foundations for modern computer security research.","sourcePage":1,"questionId":"CW3551_UNIT01_Q15","questionNumber":15,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"}]},{"unit":{"unitId":"UNIT02","unitNumber":2,"unitTitle":"Security Investigation"},"importantTwoMarks":[{"question":"What is the difference between Denial of Service (DoS) attack and Distributed Denial of Service (DDoS) attack?","answer":"| DoS Attack | DDoS Attack |\n|---|---|\n| An attack launched from a single system. | An attack launched from multiple compromised systems. |\n| Targets a server to make its services unavailable. | Floods the target with traffic from multiple sources. |\n| Easier to identify and block. | Difficult to identify and block. |\n\nExample: A single computer flooding a website is a DoS attack, whereas thousands of infected computers flooding a website is a DDoS attack.","sourcePage":1,"questionId":"CW3551_UNIT02_Q01","questionNumber":1,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"How is Due Diligence different from Due Care? What is their importance?","answer":"- Due Care: Refers to taking reasonable steps to protect an organization's information and systems.\n\n- Due Diligence: Refers to continuously investigating, monitoring and evaluating security measures to ensure they are effective.\n\nImportance: Both help organizations reduce security risks, prevent attacks and fulfil their security responsibilities.","sourcePage":1,"questionId":"CW3551_UNIT02_Q02","questionNumber":2,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"What are the professional issues in security investigation?","answer":"Professional issues in security investigation include:\n\n1. Maintaining professional standards and responsibilities.\n\n2. Protecting confidential information.\n\n3. Following organizational security policies.\n\n4. Reporting security incidents accurately.\n\n5. Avoiding misuse of professional knowledge.","sourcePage":1,"questionId":"CW3551_UNIT02_Q03","questionNumber":3,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"What are the ethical issues in security investigation?","answer":"Ethical issues in security investigation include:\n\n1. Respecting individual privacy.\n\n2. Obtaining proper authorization before accessing data.\n\n3. Maintaining confidentiality.\n\n4. Avoiding unauthorized disclosure of information.\n\n5. Using security knowledge responsibly.","sourcePage":1,"questionId":"CW3551_UNIT02_Q04","questionNumber":4,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"What are Confidentiality, Integrity and Hybrid policies? Give relevant examples.","answer":"1. Confidentiality Policy: Ensures that information is accessed only by authorized users.\n\nExample: Only authorized employees can access salary records.\n\n2. Integrity Policy: Ensures that information is accurate and protected from unauthorized modification.\n\nExample: Only authorized staff can modify student marks.\n\n3. Hybrid Policy: Combines confidentiality and integrity policies to protect information from unauthorized access and modification.\n\nExample: A banking system allows only authorized employees to view and update customer records.","sourcePage":1,"questionId":"CW3551_UNIT02_Q05","questionNumber":5,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"What are the types of security policies?","answer":"The major types of security policies are:\n\n1. Enterprise Information Security Policy (EISP): Defines the overall information security direction and responsibilities of an organization.\n\n2. Issue-Specific Security Policy (ISSP): Provides rules for specific security issues such as email and internet usage.\n\n3. System-Specific Security Policy (SysSP): Defines security rules and configurations for individual systems.","sourcePage":2,"questionId":"CW3551_UNIT02_Q06","questionNumber":6,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"Why is security required in computer systems?","answer":"Security is required in computer systems to:\n\n1. Prevent unauthorized access to information.\n\n2. Protect data from theft and modification.\n\n3. Prevent malware and cyberattacks.\n\n4. Maintain confidentiality, integrity and availability.\n\n5. Ensure safe and reliable system operation.","sourcePage":2,"questionId":"CW3551_UNIT02_Q07","questionNumber":7,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"Give one example of an ethical issue in computer security.","answer":"Accessing another person's private files without permission is an ethical issue in computer security because it violates privacy and confidentiality.","sourcePage":2,"questionId":"CW3551_UNIT02_Q08","questionNumber":8,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"Mention any two standard algorithms used in DSS.","answer":"The two standard algorithms used in the Digital Signature Standard (DSS) are:\n\n1. DSA (Digital Signature Algorithm): Used to generate and verify digital signatures.\n\n2. SHA (Secure Hash Algorithm): Used to generate a message digest for digital signature operations.","sourcePage":2,"questionId":"CW3551_UNIT02_Q09","questionNumber":9,"sourceFile":"CW3551_Unit_II_Two_Mark_Answers.pdf"},{"question":"What is Malware?","answer":"Malware is malicious software designed to damage, disrupt, steal information from or gain unauthorized access to a computer system.\n\nExamples include viruses, worms, Trojans, ransomware and spyware.","sourcePage":1,"questionId":"CW3551_UNIT02_Q10","questionNumber":10,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Differentiate between Threat and Attack.","answer":"| Threat | Attack |\n|---|---|\n| A potential danger that may exploit a system weakness. | An actual attempt to exploit a system weakness. |\n| It represents a possible security risk. | It represents an action against a system. |\n| Example: Possibility of malware infection. | Example: Installing malware on a computer. |","sourcePage":2,"questionId":"CW3551_UNIT02_Q11","questionNumber":11,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is Information Extortion?","answer":"Information extortion is a cybercrime in which an attacker threatens to reveal, destroy or misuse confidential information unless a ransom or payment is made.\n\nExample: An attacker steals company data and demands money to prevent its public release.","sourcePage":2,"questionId":"CW3551_UNIT02_Q12","questionNumber":12,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"List four important functions of an organization based on information security.","answer":"1. Prevention: Prevents security attacks.\n\n2. Detection: Identifies security incidents.\n\n3. Response: Takes action against security incidents.\n\n4. Recovery: Restores normal system operations.","sourcePage":2,"questionId":"CW3551_UNIT02_Q13","questionNumber":13,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Differentiate between Worms and Viruses.","answer":"| Worm | Virus |\n|---|---|\n| A worm is a standalone malicious program. | A virus attaches itself to a host file or program. |\n| It spreads automatically through networks. | It spreads when the infected file or program is executed. |\n| It does not require a host file. | It requires a host file or program. |","sourcePage":2,"questionId":"CW3551_UNIT02_Q14","questionNumber":14,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is a Trojan Horse?","answer":"A Trojan Horse is a type of malware that disguises itself as legitimate or useful software to trick users into installing or executing it.\n\nIt can steal information, damage files or provide unauthorized access to attackers.","sourcePage":2,"questionId":"CW3551_UNIT02_Q15","questionNumber":15,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"List any five attacks used against control systems.","answer":"Five attacks against industrial control systems (ICS) are:\n\n1. Denial of Service (DoS) attack.\n\n2. Man-in-the-Middle attack.\n\n3. Malware attack.\n\n4. Replay attack.\n\n5. Spoofing attack.","sourcePage":2,"questionId":"CW3551_UNIT02_Q16","questionNumber":16,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is Intellectual Property?","answer":"Intellectual Property (IP) refers to creations of the human mind, such as inventions, designs, software, literary works and trademarks.\n\nIt is legally protected through copyrights, patents and trademarks.","sourcePage":2,"questionId":"CW3551_UNIT02_Q17","questionNumber":17,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Differentiate between Insider Attack and Outsider Attack.","answer":"| Insider Attack | Outsider Attack |\n|---|---|\n| Launched by a person within an organization. | Launched by a person outside an organization. |\n| The attacker may have authorized access. | The attacker generally has no authorized access. |\n| Example: An employee stealing company data. | Example: A hacker attacking a company network. |","sourcePage":3,"questionId":"CW3551_UNIT02_Q18","questionNumber":18,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Define Active Attacks and its types.","answer":"An Active Attack is a security attack in which an attacker modifies, deletes, inserts or disrupts data or system operations.\n\nThe main types are:\n\n1. Masquerade: Attacker pretends to be an authorized user.\n\n2. Replay: Attacker captures and retransmits data.\n\n3. Message Modification: Attacker changes transmitted information.\n\n4. Denial of Service: Attacker prevents legitimate users from accessing services.","sourcePage":3,"questionId":"CW3551_UNIT02_Q19","questionNumber":19,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"}]},{"unit":{"unitId":"UNIT03","unitNumber":3,"unitTitle":"Digital Signature and Authentications"},"importantTwoMarks":[{"question":"What is the difference between Entity Authentication and Message Authentication?","answer":"| Entity Authentication | Message Authentication |\n|---|---|\n| Verifies the identity of a communicating entity. | Verifies the authenticity and integrity of a message. |\n| Confirms who is communicating. | Confirms that the message is genuine and unchanged. |\n| Example: Password-based login. | Example: Message Authentication Code (MAC). |","sourcePage":1,"questionId":"CW3551_UNIT03_Q01","questionNumber":1,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"Mention any two standard algorithms used in DSS.","answer":"The two standard algorithms used in the Digital Signature Standard (DSS) are:\n\n1. DSA (Digital Signature Algorithm): Used to generate and verify digital signatures.\n\n2. SHA (Secure Hash Algorithm): Used to generate a message digest for digital signature operations.","sourcePage":1,"questionId":"CW3551_UNIT03_Q02","questionNumber":2,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"Compare Digital Signatures and Digital Certificates.","answer":"| Digital Signature | Digital Certificate |\n|---|---|\n| Used to verify the authenticity and integrity of a message. | Used to verify the identity of a person or organization. |\n| Created using the sender's private key. | Issued and digitally signed by a Certificate Authority (CA). |\n| Provides authentication, integrity and non-repudiation. | Establishes trust between a public key and its owner. |","sourcePage":1,"questionId":"CW3551_UNIT03_Q03","questionNumber":3,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"List the security services provided by Digital Signature.","answer":"The security services provided by a digital signature are:\n\n1. Authentication: Verifies the identity of the sender.\n\n2. Integrity: Ensures that the message has not been modified.\n\n3. Non-repudiation: Prevents the sender from denying the signed message.","sourcePage":1,"questionId":"CW3551_UNIT03_Q04","questionNumber":4,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"Write the two algorithms for the DSS scheme.","answer":"The two main algorithms used in the Digital Signature Standard (DSS) are:\n\n1. DSA (Digital Signature Algorithm): Generates and verifies digital signatures.\n\n2. SHA (Secure Hash Algorithm): Produces a message digest used during digital signature generation and verification.","sourcePage":1,"questionId":"CW3551_UNIT03_Q05","questionNumber":5,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"Distinguish between Origin Authentication and Entity Authentication.","answer":"| Origin Authentication | Entity Authentication |\n|---|---|\n| Verifies the source or origin of a message. | Verifies the identity of a communicating entity. |\n| Confirms who sent the message. | Confirms who is participating in communication. |\n| Example: Verifying the sender of an email. | Example: User login authentication. |","sourcePage":2,"questionId":"CW3551_UNIT03_Q06","questionNumber":6,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"What is Kerberos Authentication Protocol?","answer":"Kerberos is a network authentication protocol that uses secret-key cryptography and tickets to authenticate users and services securely over an insecure network.\n\nIt uses a trusted third party called the Key Distribution Center (KDC) to provide authentication.","sourcePage":2,"questionId":"CW3551_UNIT03_Q07","questionNumber":7,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"What is an X.509 Certificate?","answer":"X.509 is an international standard that defines the format of digital certificates used in Public Key Infrastructure (PKI).\n\nIt contains information such as:\n\n1. Certificate owner's name.\n\n2. Public key.\n\n3. Issuer's name.\n\n4. Validity period.\n\n5. Certificate Authority's digital signature.\n\nIt is used to verify the identity of users and organizations.","sourcePage":2,"questionId":"CW3551_UNIT03_Q08","questionNumber":8,"sourceFile":"CW3551_Unit_III_Two_Mark_Answers.pdf"},{"question":"Compare RSA Algorithm and DSA Algorithm.","answer":"| RSA Algorithm | DSA Algorithm |\n|---|---|\n| RSA stands for Rivest–Shamir–Adleman. | DSA stands for Digital Signature Algorithm. |\n| Used for encryption, decryption and digital signatures. | Primarily used for digital signatures. |\n| Security is based on integer factorization. | Security is based on the discrete logarithm problem. |\n| Can provide encryption and digital signatures. | Provides digital signature generation and verification. |","sourcePage":3,"questionId":"CW3551_UNIT03_Q09","questionNumber":9,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What are the properties of Digital Signatures?","answer":"1. Authentication: Verifies the identity of the sender.\n\n2. Integrity: Ensures that the message is not modified.\n\n3. Non-repudiation: Prevents the sender from denying the signature.\n\n4. Unforgeability: Prevents unauthorized users from creating a valid signature.","sourcePage":3,"questionId":"CW3551_UNIT03_Q10","questionNumber":10,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What are the characteristics of a certificate generated by a Certificate Authority (CA)?","answer":"A digital certificate issued by a Certificate Authority has the following characteristics:\n\n1. Identity: Identifies the certificate owner.\n\n2. Public Key: Contains the owner's public key.\n\n3. Issuer: Identifies the Certificate Authority.\n\n4. Validity: Specifies the certificate's validity period.\n\n5. Digital Signature: Contains the CA's digital signature.\n\nIt establishes security, public trust and reliability in digital communication.","sourcePage":3,"questionId":"CW3551_UNIT03_Q11","questionNumber":11,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"List the requirements of Kerberos.","answer":"The important requirements of Kerberos are:\n\n1. Secure: Prevents unauthorized access.\n\n2. Reliable: Provides dependable authentication.\n\n3. Transparent: Authentication should be simple for users.\n\n4. Scalable: Supports a large number of users and services.","sourcePage":3,"questionId":"CW3551_UNIT03_Q12","questionNumber":12,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is a Primitive Root?","answer":"A Primitive Root is an integer whose powers generate all the non-zero integers modulo a prime number.\n\nFor a prime number p, an integer g is a primitive root if its powers modulo p produce all non-zero residues from 1 to p−1.\n\nExample: 3 is a primitive root modulo 7 because its powers generate 1, 2, 3, 4, 5 and 6 modulo 7.","sourcePage":4,"questionId":"CW3551_UNIT03_Q13","questionNumber":13,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"}]},{"unit":{"unitId":"UNIT04","unitNumber":4,"unitTitle":"Email and IP Security"},"importantTwoMarks":[{"question":"State the significance of Message Transfer Agent (MTA).","answer":"A Message Transfer Agent (MTA) is software responsible for transferring email messages from one mail server to another using the SMTP protocol.\n\nSignificance:\n\n1. Transfers emails between mail servers.\n\n2. Routes messages to the correct destination.\n\n3. Stores and forwards messages when required.","sourcePage":1,"questionId":"CW3551_UNIT04_Q01","questionNumber":1,"sourceFile":"CW3551_Unit_IV_Two_Mark_Answers.pdf"},{"question":"What are the services provided by PGP?","answer":"PGP (Pretty Good Privacy) provides the following security services:\n\n1. Authentication: Verifies the sender using a digital signature.\n\n2. Confidentiality: Encrypts messages using symmetric encryption.\n\n3. Compression: Compresses messages before encryption.\n\n4. Email Compatibility: Converts encrypted data into ASCII format using Radix-64 encoding.\n\n5. Segmentation: Divides large messages into smaller parts for transmission.","sourcePage":1,"questionId":"CW3551_UNIT04_Q02","questionNumber":2,"sourceFile":"CW3551_Unit_IV_Two_Mark_Answers.pdf"},{"question":"Describe the Encapsulating Security Payload (ESP).","answer":"Encapsulating Security Payload (ESP) is a protocol of IPsec that provides security to IP packets through encryption and optional authentication.\n\nIts main services are:\n\n1. Confidentiality through encryption.\n\n2. Data origin authentication.\n\n3. Connectionless integrity.\n\n4. Anti-replay protection.\n\nESP protects data during transmission over an IP network.","sourcePage":1,"questionId":"CW3551_UNIT04_Q03","questionNumber":3,"sourceFile":"CW3551_Unit_IV_Two_Mark_Answers.pdf"},{"question":"Explain the architecture of Secure Electronic Payment.","answer":"Secure Electronic Transaction (SET) is a protocol designed to provide secure credit card transactions over the internet.\n\nIts main components are:\n\n1. Cardholder: Person who purchases goods or services.\n\n2. Merchant: Seller who provides goods or services.\n\n3. Issuer: Bank that issues the payment card.\n\n4. Acquirer: Merchant's bank that processes payments.\n\n5. Payment Gateway: Processes and authorizes electronic payments.\n\n6. Certificate Authority (CA): Issues digital certificates to verify identities.","sourcePage":1,"questionId":"CW3551_UNIT04_Q04","questionNumber":4,"sourceFile":"CW3551_Unit_IV_Two_Mark_Answers.pdf"},{"question":"Why do we need a key ring in data communication?","answer":"A key ring is a collection of cryptographic keys maintained by a user in PGP.\n\nIt is needed to:\n\n1. Store public keys of other users.\n\n2. Store the user's own private and public keys.\n\n3. Manage and retrieve keys easily.\n\n4. Support encryption, decryption and digital signature operations.","sourcePage":2,"questionId":"CW3551_UNIT04_Q05","questionNumber":5,"sourceFile":"CW3551_Unit_IV_Two_Mark_Answers.pdf"},{"question":"Write a note on Email Architecture.","answer":"Email architecture is the structure used to send, receive and manage electronic messages over a network.\n\nIts main components are:\n\n1. User Agent (UA): Allows users to compose, send and read emails.\n\n2. Message Transfer Agent (MTA): Transfers emails between mail servers using SMTP.\n\n3. Message Access Agent (MAA): Allows users to retrieve emails using POP3 or IMAP.\n\n4. Mail Server: Stores and manages email messages.","sourcePage":2,"questionId":"CW3551_UNIT04_Q06","questionNumber":6,"sourceFile":"CW3551_Unit_IV_Two_Mark_Answers.pdf"},{"question":"What is the purpose of the Padding Field in ESP?","answer":"The Padding Field in Encapsulating Security Payload (ESP) is used to:\n\n1. Align data according to encryption algorithm requirements.\n\n2. Ensure that the encrypted data has the required block size.\n\n3. Hide the actual length of the payload to some extent.","sourcePage":4,"questionId":"CW3551_UNIT04_Q07","questionNumber":7,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Describe Replay Attack.","answer":"A Replay Attack is a security attack in which an attacker captures a valid transmitted message and retransmits it later to gain unauthorized access or perform fraudulent operations.\n\nExample: An attacker captures a valid banking transaction request and retransmits it to repeat the transaction.\n\nPrevention: Sequence numbers, timestamps and anti-replay mechanisms are used to prevent replay attacks.","sourcePage":4,"questionId":"CW3551_UNIT04_Q08","questionNumber":8,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is POP3?","answer":"POP3 (Post Office Protocol Version 3) is an email protocol used by a client to retrieve emails from a mail server.\n\nIts main functions are:\n\n1. Downloads emails from the mail server.\n\n2. Allows users to read received messages.\n\n3. Can remove downloaded messages from the server.","sourcePage":4,"questionId":"CW3551_UNIT04_Q09","questionNumber":9,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is PGP?","answer":"PGP (Pretty Good Privacy) is an email security system used to provide confidentiality and authentication through encryption and digital signatures.\n\nIt provides authentication, confidentiality, compression, email compatibility and message segmentation.","sourcePage":4,"questionId":"CW3551_UNIT04_Q10","questionNumber":10,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is MIME?","answer":"MIME (Multipurpose Internet Mail Extensions) is an internet standard that extends the email format to support different types of data.\n\nIt allows emails to contain:\n\n1. Images.\n\n2. Audio and video files.\n\n3. Documents and attachments.\n\n4. Non-ASCII text.","sourcePage":4,"questionId":"CW3551_UNIT04_Q11","questionNumber":11,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is S/MIME?","answer":"S/MIME (Secure/Multipurpose Internet Mail Extensions) is a standard used to provide security for electronic mail messages.\n\nIt provides:\n\n1. Authentication: Verifies the sender.\n\n2. Confidentiality: Encrypts email messages.\n\n3. Integrity: Protects messages from modification.\n\n4. Non-repudiation: Provides evidence of the sender's digital signature.","sourcePage":4,"questionId":"CW3551_UNIT04_Q12","questionNumber":12,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"}]},{"unit":{"unitId":"UNIT05","unitNumber":5,"unitTitle":"Web Security"},"importantTwoMarks":[{"question":"What is Digital Signature Verification in SET?","answer":"In Secure Electronic Transaction (SET), digital signature verification is the process of checking the authenticity and integrity of an electronic payment message using the sender's public key.\n\nIt ensures that the message was sent by the authorized person and has not been modified.","sourcePage":1,"questionId":"CW3551_UNIT05_Q01","questionNumber":1,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"List the parameters of Session State in TLS.","answer":"The parameters of TLS Session State are:\n\n1. Session Identifier: Identifies the session.\n\n2. Peer Certificate: Contains the peer's digital certificate.\n\n3. Compression Method: Specifies the compression algorithm.\n\n4. Cipher Spec: Defines the encryption and hashing algorithms.\n\n5. Master Secret: A secret value shared between the client and server.\n\n6. Is Resumable: Indicates whether the session can be reused.","sourcePage":1,"questionId":"CW3551_UNIT05_Q02","questionNumber":2,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"Explain the Architecture of SSL.","answer":"SSL (Secure Sockets Layer) is a security protocol that provides secure communication between a client and a server over a network.\n\nThe SSL architecture consists of four main protocols:\n\n1. SSL Record Protocol: Provides encryption and message integrity.\n\n2. Handshake Protocol: Establishes security parameters and authenticates the parties.\n\n3. Change Cipher Spec Protocol: Activates the negotiated security settings.\n\n4. Alert Protocol: Sends warning and error messages between communicating parties.","sourcePage":1,"questionId":"CW3551_UNIT05_Q03","questionNumber":3,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"Explain the concept of Digital Signature Verification.","answer":"Digital signature verification is the process of checking whether a digital signature is valid using the sender's public key.\n\nSteps:\n\n1. The receiver obtains the signed message and digital signature.\n\n2. The receiver uses the sender's public key to verify the signature.\n\n3. The receiver calculates the message digest.\n\n4. Both digest values are compared.\n\n5. If they match, the signature is valid.","sourcePage":1,"questionId":"CW3551_UNIT05_Q04","questionNumber":4,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"Differentiate between Session and Connection in TLS.","answer":"| Session | Connection |\n|---|---|\n| A session is an association between a client and server. | A connection is a temporary communication channel between them. |\n| It defines shared security parameters. | It uses the security parameters of a session. |\n| Multiple connections can belong to one session. | Each connection is associated with one session. |\n| It can be reused for multiple connections. | It is terminated when communication ends. |","sourcePage":2,"questionId":"CW3551_UNIT05_Q05","questionNumber":5,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"Write a note on Digital Signature Verification in Secure Electronic Transaction (SET).","answer":"In SET, digital signature verification ensures the authenticity and integrity of electronic payment transactions.\n\n1. The receiver obtains the sender's digital signature.\n\n2. The sender's public key is used to verify the signature.\n\n3. The message digest is calculated and compared.\n\n4. If both digest values match, the signature is valid.\n\nIt prevents unauthorized modification and provides authentication and non-repudiation.","sourcePage":2,"questionId":"CW3551_UNIT05_Q06","questionNumber":6,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"What is Handshake Protocol?","answer":"The TLS Handshake Protocol is used to establish a secure connection between a client and a server.\n\nIts functions are:\n\n1. Negotiates security algorithms.\n\n2. Authenticates the client and server.\n\n3. Establishes shared secret keys.\n\n4. Creates secure communication parameters.","sourcePage":2,"questionId":"CW3551_UNIT05_Q07","questionNumber":7,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"What is Record Protocol?","answer":"The TLS Record Protocol provides secure transmission of application data between a client and a server.\n\nIts main functions are:\n\n1. Fragmentation of data.\n\n2. Optional compression.\n\n3. Encryption of data.\n\n4. Message integrity protection.","sourcePage":2,"questionId":"CW3551_UNIT05_Q08","questionNumber":8,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"What is Alert Protocol?","answer":"The TLS Alert Protocol is used to communicate warning and error messages between a client and a server.\n\nIt provides two types of alerts:\n\n1. Warning Alert: Indicates a non-critical problem.\n\n2. Fatal Alert: Indicates a serious error and terminates the connection.","sourcePage":2,"questionId":"CW3551_UNIT05_Q09","questionNumber":9,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"What is SSL?","answer":"SSL (Secure Sockets Layer) is a security protocol developed by Netscape to provide encrypted communication between a client and a server over the internet.\n\nIt provides confidentiality, authentication and data integrity.\n\nNote: SSL is obsolete and has been replaced by TLS.","sourcePage":2,"questionId":"CW3551_UNIT05_Q10","questionNumber":10,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"What is SET?","answer":"SET (Secure Electronic Transaction) is a security protocol developed by Visa and Mastercard to secure credit card transactions over the internet.\n\nIt provides:\n\n1. Confidentiality.\n\n2. Authentication.\n\n3. Data integrity.\n\n4. Secure electronic payment processing.","sourcePage":3,"questionId":"CW3551_UNIT05_Q11","questionNumber":11,"sourceFile":"CW3551_Unit_V_Two_Mark_Answers.pdf"},{"question":"What are the types of SSL Certificates?","answer":"The major types of SSL certificates are:\n\n1. Domain Validated (DV): Verifies domain ownership.\n\n2. Organization Validated (OV): Verifies domain ownership and organization details.\n\n3. Extended Validation (EV): Provides extensive verification of the organization's identity.\n\nThese certificates help establish secure communication between websites and users.","sourcePage":5,"questionId":"CW3551_UNIT05_Q12","questionNumber":12,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Differentiate between TLS 1.2 and TLS 1.3.","answer":"| TLS 1.2 | TLS 1.3 |\n|---|---|\n| Older version of TLS. | Newer version of TLS. |\n| Handshake generally requires two round trips. | Handshake generally requires one round trip. |\n| Supports older cryptographic algorithms and cipher suites. | Supports modern and stronger cryptographic algorithms. |\n| Supports RSA key exchange. | Removes static RSA key exchange. |\n| Comparatively slower handshake. | Faster and more secure handshake. |","sourcePage":5,"questionId":"CW3551_UNIT05_Q13","questionNumber":13,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"What is the difference between Passive and Active Attacks in Web Security?","answer":"| Passive Attack | Active Attack |\n|---|---|\n| Monitors or observes communication without modifying data. | Modifies, deletes or disrupts communication. |\n| Mainly targets confidentiality. | Mainly targets integrity and availability. |\n| Difficult to detect. | Usually easier to detect. |\n| Example: Eavesdropping and traffic analysis. | Example: Website defacement and DoS attacks. |","sourcePage":5,"questionId":"CW3551_UNIT05_Q14","questionNumber":14,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Explain Change Cipher Spec Protocol.","answer":"The Change Cipher Spec Protocol is a protocol in SSL/TLS used to inform the other party that the negotiated security parameters and cipher specifications will now be activated.\n\nIts functions are:\n\n1. Activates the negotiated encryption algorithm.\n\n2. Activates the selected authentication and integrity mechanisms.\n\n3. Indicates that subsequent records will use the new security settings.","sourcePage":5,"questionId":"CW3551_UNIT05_Q15","questionNumber":15,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"},{"question":"Define TLS.","answer":"TLS (Transport Layer Security) is a cryptographic protocol used to provide secure communication between clients and servers over a network.\n\nIt provides three main security services:\n\n1. Confidentiality: Protects data through encryption.\n\n2. Integrity: Protects data from unauthorized modification.\n\n3. Authentication: Verifies the communicating parties.\n\nTLS is the successor to SSL.","sourcePage":5,"questionId":"CW3551_UNIT05_Q16","questionNumber":16,"sourceFile":"CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"}]}],"metadata":{"title":"CW3551 – Data and Information Security – Important 2 Marks","sourceFiles":["CW3551_Unit_I_Two_Mark_Answers.pdf","CW3551_Unit_II_Two_Mark_Answers.pdf","CW3551_Unit_III_Two_Mark_Answers.pdf","CW3551_Unit_IV_Two_Mark_Answers.pdf","CW3551_Unit_V_Two_Mark_Answers.pdf","CW3551_Extra_Two_Mark_Answers_Units_I_to_V.pdf"],"primaryAnswerSource":"User-supplied PDFs only","answerEditing":"No answer rewriting or answer generation. Text is transcribed from supplied PDF answer sections; paragraph line wraps are normalized and comparison layouts are rendered as Markdown tables.","unitQuestionCounts":{"UNIT01":15,"UNIT02":19,"UNIT03":13,"UNIT04":12,"UNIT05":16},"totalQuestions":75,"notes":["Questions in each unit are ordered with the corresponding unit PDF first, followed by the extra-question PDF order.","The extra PDF states that duplicate questions were filtered out before it was supplied.","The separate RAND Report R-609 note on page 6 of the extra PDF is retained as source metadata rather than added to the answer body."],"randReportSourceNote":"The extra PDF page 6 states: Its full title is Security Controls for Computer Systems: Report of Defense Science Board Task Force on Computer Security, edited by Willis H. Ware and published in February 1970. The report was later reissued as R-609-1 in October 1979."}}</script>

var ImportantMarks={

    var errors=[];

    if(!isObj(raw.subject))errors.push('subject metadata is required.');
    if(!isObj(raw.unit))errors.push('unit metadata is required.');
    if(!Array.isArray(raw.importantTwoMarks)||!raw.importantTwoMarks.length)errors.push('importantTwoMarks must be a non-empty array.');

    if(!isStr(raw.subject.subjectCode))errors.push('subject.subjectCode is required.');
    if(!isStr(raw.subject.subjectName))errors.push('subject.subjectName is required.');
    if(!isStr(raw.unit.unitId))errors.push('unit.unitId is required.');
    if(!(Number.isInteger(raw.unit.unitNumber)&&raw.unit.unitNumber>0))errors.push('unit.unitNumber must be a positive integer.');
    if(!isStr(raw.unit.unitTitle))errors.push('unit.unitTitle is required.');
